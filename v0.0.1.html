<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine Print Syndicate (Phaser)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#9FB0C2; --panel:#24264F; --panel-2:#30336A; --edge:#12133A; --line:#3B3E7A;
  --ink:#FFFFFF; --ink-dim:#D0D3F7; --gold:#FFD23F; --money:#4BE39A; --danger:#FF6B6B; --pink:#FF8FB1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0E1030; color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#0E1030; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);box-shadow:0 0 0 3px var(--edge)}
.px{font-family:"Pixelify Sans","Trebuchet MS",sans-serif}

/* HUD */
.hud{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;padding:8px 8px 6px;background:var(--panel);border-bottom:3px solid var(--edge);font-family:"Pixelify Sans","Trebuchet MS",sans-serif}
.stat{background:var(--panel-2);border:2px solid var(--edge);border-radius:6px;padding:5px 8px;min-width:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.07)}
.stat .k{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.01em}
.stat b{display:block;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.stat small{display:block;font-size:13px;color:var(--ink-dim);line-height:1.25}
.cash b{color:var(--money)} .cash.neg b{color:var(--danger)}
.stock b{color:var(--gold)}
.bar{height:10px;background:var(--edge);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--pink);transition:width .4s}
.qrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim);padding:2px 2px 0}
.qbar{flex:1;height:8px;background:var(--edge);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--gold)}

/* Tower */
#towerWrap{flex:1;position:relative;overflow:hidden;background:#9FB0C2;touch-action:none;min-height:0}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}
#towerInner{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
#stage{position:relative}
canvas{display:block;width:100%;cursor:pointer;image-rendering:pixelated;touch-action:manipulation}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:"Pixelify Sans","Trebuchet MS",sans-serif;font-weight:700;font-size:16px;color:var(--money);white-space:nowrap;
  text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge);animation:rise 1.4s ease-out forwards}
.pop.bad{color:var(--danger)}
.pop.stamp{color:#fff;background:var(--danger);padding:0 6px;border:2px solid var(--edge);text-shadow:none;rotate:-8deg;font-size:14px}
.pop.stamp.ok{background:#2FB879}
@keyframes rise{from{opacity:1;transform:translate(-50%,-100%)}to{opacity:0;transform:translate(-50%,-280%)}}

/* Dock */
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 8px 10px;background:var(--panel);border-top:3px solid var(--edge)}
.btn{font-family:"Pixelify Sans","Trebuchet MS",sans-serif;font-weight:600;font-size:17px;line-height:1.1;color:#2A1E00;background:var(--gold);border:3px solid var(--edge);border-radius:7px;padding:10px 12px;box-shadow:0 4px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.45);cursor:pointer;position:relative;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15)}
.btn:disabled{filter:grayscale(.85) brightness(.75);cursor:not-allowed}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.green{background:#4BE39A}
.btn.red{background:#FF7A7A}
.btn.ghost{background:#C9CCF5}
.btn.blue{background:#7FD3F7}
.btn small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.badge{display:inline-block;min-width:22px;padding:1px 6px;margin-left:4px;border-radius:999px;background:var(--edge);color:#fff;font-size:14px}
.btn.hot .badge{background:var(--danger);animation:thump 1s steps(2) infinite}
@keyframes thump{50%{transform:scale(1.15)}}

/* Toasts */
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 124px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--panel);border:3px solid var(--edge);border-left:8px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--edge);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--danger)} .toast.good{border-left-color:var(--money)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,40,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#modal[hidden]{display:none}
@media (min-width:700px){#modal{align-items:center}}
.sheet{width:min(520px,100%);max-height:min(86vh,740px);overflow-y:auto;background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--line);padding:18px 18px 20px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:"Pixelify Sans","Trebuchet MS",sans-serif;font-size:27px;margin:0 0 8px;color:var(--gold);font-weight:700;line-height:1.12}
.sheet h3{font-family:"Pixelify Sans","Trebuchet MS",sans-serif;font-size:19px;margin:0 0 4px;font-weight:600}
.sheet p{margin:0 0 12px;line-height:1.5;font-size:16px;max-width:62ch}
.sheet .dim{color:var(--ink-dim);font-size:15px}
.sheet .joke{color:var(--ink-dim);font-style:italic;font-size:15px}
.closeRow{display:flex;justify-content:flex-end;margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{background:none;border:0;color:var(--ink-dim);font-size:26px;line-height:1;cursor:pointer;padding:0 4px;font-family:"Pixelify Sans",sans-serif}
.x:focus-visible{outline:3px solid #fff;border-radius:4px}

.claim{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:12px;margin:0 0 10px}
.claim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:"Pixelify Sans",sans-serif}
.claim-top b{font-size:18px}
.amt{color:var(--gold);font-size:20px;font-weight:700}
.claim p{margin:6px 0 8px;font-size:16px}
.pat{height:7px;background:var(--edge);border-radius:3px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--money)}
.pat.low i{background:var(--danger)}
.patlbl{display:block;font-size:13px;color:var(--ink-dim);margin:3px 0 10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row3 .btn{font-size:15px;padding:9px 6px}
.empty{text-align:center;padding:22px 8px;color:var(--ink-dim)}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.type{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.type:hover:not(:disabled){border-color:var(--gold)}
.type:focus-visible{outline:3px solid #fff}
.type:disabled{opacity:.5;cursor:not-allowed}
.type .sw{height:16px;border-radius:3px;border:2px solid var(--edge)}
.type b{font-family:"Pixelify Sans",sans-serif;font-size:17px}
.type span{font-size:14px;line-height:1.4;color:var(--ink-dim)}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.frow .sw{width:14px;align-self:stretch;border-radius:3px;border:2px solid var(--edge)}
.frow .nm{flex:1;min-width:0;font-family:"Pixelify Sans",sans-serif;font-size:16px}
.frow .btn{font-size:14px;padding:7px 9px}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:9px;height:9px;background:rgba(255,255,255,.2);border:1px solid var(--edge)}
.pips i.on{background:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.fact span{display:block;font-size:14px;color:var(--ink-dim)}
.fact b{font-family:"Pixelify Sans",sans-serif;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.seg .btn{font-size:15px}
.seg .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}
.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 6px}
.designs .btn{font-size:14px;padding:8px 6px}
.intel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.intel div{background:rgba(0,0,0,.22);border:2px solid var(--edge);border-radius:6px;padding:5px 7px;min-width:0}
.intel span{display:block;font-size:13px;color:var(--ink-dim)}
.intel b{font-family:"Pixelify Sans",sans-serif;font-size:17px;font-weight:600}
.intel .lock{color:var(--ink-dim);font-size:13px;font-family:"Rubik",sans-serif;font-weight:500}
.intel .bad,.intel .sev3{color:var(--danger)} .intel .good,.intel .sev1{color:var(--money)} .intel .sev2{color:var(--gold)}
.sheet .intel-hint{font-size:14px;color:var(--ink-dim);margin:0 0 10px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.designs .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}

.ledger{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.ledger td{padding:6px 0;border-bottom:2px dashed var(--line)}
.ledger td:last-child{text-align:right;font-family:"Pixelify Sans",sans-serif;font-size:17px}
.ledger tr.total td{border-bottom:0;font-weight:700;padding-top:10px}
.ledger tr.total td:last-child{font-size:21px}
.ledger tr.exp td{color:var(--ink-dim);border-bottom:0}
.pos{color:var(--money)} .neg{color:var(--danger)}
.move{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-family:"Pixelify Sans",sans-serif}
.move b{font-size:20px} .move em{font-style:normal;font-size:24px;font-weight:700}
.move.up em{color:var(--money)} .move.down em{color:var(--danger)}
blockquote{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--gold);background:rgba(255,255,255,.05);font-size:16px;line-height:1.45;border-radius:0 6px 6px 0}
blockquote cite{display:block;font-style:normal;color:var(--ink-dim);font-size:14px;margin-top:4px}
.note{background:rgba(255,107,107,.12);border:2px solid rgba(255,107,107,.4);border-radius:6px;padding:8px 10px;font-size:14px!important}
.big{font-family:"Pixelify Sans",sans-serif;font-size:48px;color:var(--gold);line-height:1;margin:6px 0 8px}
.spark{width:100%;height:80px;display:block;margin:6px 0 4px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px}
.action{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.action p{margin:0;font-size:15px;color:var(--ink-dim)}
.action .btn{flex:none;font-size:15px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choices .btn{text-align:left;font-size:17px}
.goals{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:16px;line-height:1.3}
.goals li i{flex:none;width:20px;height:20px;border:2px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-weight:700;color:#12133A}
.goals li.ok i{background:var(--money)}
.goals li span{flex:1}
.goals li b{font-family:"Pixelify Sans",sans-serif;color:var(--ink-dim);white-space:nowrap}
.goals li.ok b{color:var(--money)}
.ledger small{font-size:13px;color:var(--ink-dim)}
.howto p{display:flex;gap:10px;align-items:flex-start}
.howto p span{flex:none;font-size:22px;line-height:1.2}
@media (prefers-reduced-motion: reduce){
  .pop{animation:fade 1.2s linear forwards}
  @keyframes fade{to{opacity:0}}
  .btn.hot .badge,.sheet,.toast{animation:none}
}
#labels{position:absolute;inset:0;pointer-events:none}
.flabel{position:absolute;display:flex;align-items:center;gap:5px;padding:0 5px 1px;background:rgba(18,19,58,.88);border-radius:3px;font-family:"Pixelify Sans","Trebuchet MS",sans-serif;font-weight:600;font-size:11.5px;line-height:1.2;color:#fff;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.35);-webkit-font-smoothing:antialiased}
.flabel .pp{display:inline-flex;gap:2px}
.flabel .pp i{width:5px;height:5px;background:rgba(255,255,255,.28)}
.flabel .pp i.on{background:#FFD23F}
.flabel .tg{font-size:10.5px}
@media (min-width:480px){ .flabel{font-size:13px} .flabel .tg{font-size:12px} .flabel .pp i{width:6px;height:6px} }
@media (prefers-reduced-motion: reduce){
}
@media (max-width:380px){ .stat b{font-size:18px} .btn{font-size:15px} }
</style>
</head>
<body>
<div id="app">
  <header class="hud" aria-live="off">
    <div class="stat cash" id="cashBox"><span class="k">Cash</span><b id="cash">£0</b><small id="rate">+£0/s</small></div>
    <div class="stat stock"><span class="k">Share price</span><b id="stock">£10.00</b><small id="rank">Interim CEO</small></div>
    <div class="stat"><span class="k">Customer mood</span><div class="bar"><i id="happyBar"></i></div><small id="happyTxt">Fine</small></div>
    <div class="qrow"><span id="qLabel">Q1 earnings call in 60s</span><div class="qbar"><i id="qBar"></i></div></div>
  </header>
  <main id="towerWrap">
    <div id="game" role="img" aria-label="Your insurance tower. Tap a floor to manage it, tap a broker in The Room to handle their claim, and drag to scroll."></div>
  </main>
  <nav class="dock">
    <button class="btn blue" id="btnFloors">Floors</button>
    <button class="btn" id="btnClaims">Claims<span class="badge" id="badge">0</span></button>
    <button class="btn ghost" id="btnBoard">Boardroom</button>
  </nav>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function fmt(n){
  const s = n < 0 ? "−" : ""; n = Math.abs(n);
  if (n >= 1e9) return s+"£"+(n/1e9).toFixed(2)+"B";
  if (n >= 1e6) return s+"£"+(n/1e6).toFixed(2)+"M";
  if (n >= 1e4) return s+"£"+(n/1e3).toFixed(1)+"K";
  return s+"£"+Math.round(n).toLocaleString("en-US");
}
const fmtR = n => n < 10 ? (n<0?"−":"")+"£"+Math.abs(n).toFixed(1) : fmt(n);
const fmt2 = n => "£"+n.toFixed(2);

/* ---------- Game data ---------- */
const TYPES = {

const FRAUD_QUIPS = ["The raccoon was a cat in a mask.","The “bees” were a Bluetooth speaker.","The gnome turned up in their own shed.","The science fair volcano was never plugged in.","They filed the same claim with four other syndicates.","The receipt was written in crayon.","The “flood” was a single knocked-over glass of water.","The goat has an alibi."];

function intelText(n){

}
const SKINS = ["#FFDBAC","#F2C9A0","#E0A878","#C68650","#8D5524","#5C3A21"];
const HAIRS = ["#2B1B10","#5A3825","#C9A227","#B5562E","#1C1C1C","#9A9AA8","#E86A92","#3E5CC4"];
const CUST_SHIRTS = ["#E8452C","#3FA05A","#F2A93B","#5A6FD6","#C04ACB","#2BB3B1","#FFFFFF","#8A6A4A"];
const NAMES = ["Brenda","Doug","Priya","Mo","Gus","Linh","Darnell","Agnes","Tobias","Rosa","Kenji","Fatima","Bjorn","Dolores","Marcus","Wren","Ines","Hank","Yuki","Otis","Mabel","Raj","Colette","Sven","Beatrix","Chidi","Gertrude","Mateo","Noor","Phil","Svetlana","Tariq","Ursula","Vince","Ada","Bongani","Cormac","Deb","Esperanza","Florian","Greta","Hiroshi","Imani","Jules","Kofi","Lorraine","Nigel","Olga","Pedro","Quinn","Rufus","Saoirse","Thandiwe","Walt"];
const INCIDENTS = [

function addClaim(name, desc, amount){

function typicalClaim(){ return Math.max(25, Math.max(3, baseIncome())*Math.max(4, 20/(1 + 0.12*lv("sales")))*0.6*(1-actRed())); }
function ensureIntel(c){
  if (c.sev != null) return;
  const r = c.amount / typicalClaim();
  c.sev = r < 0.8 ? 1 : r < 1.25 ? 2 : 3;
  c.lp = Math.random() < 0.75 ? rand(0.68, 0.98) : rand(0.05, 0.45);
  c.legit = Math.random() < c.lp;
  c.sue = c.lp < 0.5 ? rand(0.02, 0.12) : clamp(rand(0.08, 0.5) + (c.sev-2)*0.12, 0.03, 0.8);

}
function estCenter(p, nz, sp){ return clamp(p*100 + nz*sp/2, 0, 100); }
function legitEst(c){ ensureIntel(c); return estCenter(c.lp, c.nz1, intelSpread(lv("risk"))); }
function suePct(c){ return c.sue*Math.pow(0.85, lv("legal")); }
function estText(p, nz, sp){
  if (sp === 0) return Math.round(p*100) + "%";
  const ctr = estCenter(p, nz, sp);

}

  const sp = intelSpread(n);
  const lock = need => `<b class="lock">🔒 Risk level ${need}</b>`;
  const lc = estCenter(c.lp, c.nz1, sp), sc = estCenter(suePct(c), c.nz2, sp);
  return `<div class="intel">

  </div>`;
}

function custFor(id){ return CUST.find(u => u.id === id && u.state !== "out"); }
function resolve(c, action, src){
  const idx = S.claims.indexOf(c); if (idx < 0) return;
  S.claims.splice(idx,1);
  const u = custFor(c.id);
  const L = layout();
  const fxX = src === "you" ? (u ? u.x : 110) : 100;
  const fxY = src === "you" ? L.lobbyY + 22 : floorY(L, src) + 18;
  ensureIntel(c);
  if (action === "pay"){
    spend(c.amount, "paid"); S.served++;
    if (c.legit) mood(2.5);
    else { mood(0.5); S.fraudPaid = (S.fraudPaid || 0) + 1; if (src === "you" || Math.random() < .4) toast(`You paid ${c.name}’s claim. It was fraud. ${pick(FRAUD_QUIPS)}`, "bad"); }
    if (src === "you") pop("−"+fmt(c.amount), fxX, fxY, "bad"); else pop("Paid", fxX, fxY, "stamp ok");
    if (u) u.mood = "happy";
  } else if (action === "deny"){
    const lg = lv("legal");
    if (c.legit) mood(-7*SEV_MULT[c.sev-1]*Math.max(0.3, 1 - 0.12*lg));
    else { mood(-1); S.fraudCaught = (S.fraudCaught || 0) + 1; if (src === "you") toast(`Good call. ${c.name}’s claim was fraud. ${pick(FRAUD_QUIPS)}`, "good"); }
    const chance = suePct(c);
    if (Math.random() < chance){
      S.lawsuits.push({t:rand(15,35), amt:Math.round(c.amount*(2 + c.sev*0.5))});
      if (src === "you") toast(`${c.name} called a lawyer on the way out. This could get expensive.`, "bad");
    }
    pop(c.legit ? "Denied" : "Fraud!", fxX, fxY, c.legit ? "stamp" : "stamp ok");
    if (u) u.mood = "angry";
  } else if (action === "stall"){
    c.stalls++;
    if (Math.random() < 0.65) S.returns.push({t:rand(18,30), c});
    else S.returns.push({t:rand(6,12), c, gaveUp:true});
    pop("Form 27-B", fxX, fxY, "stamp ok");
    if (u) u.mood = "confused";
  }
  if (u) u.state = "out";
}
function expireClaim(c){
  const i = S.claims.indexOf(c); if (i >= 0) S.claims.splice(i,1);
  const u = custFor(c.id); if (u){ u.mood = "angry"; u.state = "out"; }
  ensureIntel(c); mood(-8*SEV_MULT[c.sev-1]);
  if (Math.random() < 0.4){ const f = Math.round(c.amount); spend(f, "other"); toast(`${c.name} got tired of waiting and complained to the regulator. Fine: ${fmt(f)}.`, "bad"); }
  else toast(`${c.name} got tired of waiting and left a review: “${pick(REVIEWS)}”`, "bad");
}

let ctx = null, LH = 0;

function hexLerp(a,b,t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round(((pa>>16)&255)*(1-t) + ((pb>>16)&255)*t);
  const g = Math.round(((pa>>8)&255)*(1-t) + ((pb>>8)&255)*t);
  const bl = Math.round((pa&255)*(1-t) + (pb&255)*t);
  return `rgb(${r},${g},${bl})`;
}
const SKY = [[0,"#A7C0D4","#DCE4EA"],[0.6,"#93B2CA","#CCD8E2"],[0.76,"#E3907C","#F0C79E"],[0.88,"#3A3D6F","#7A6A9A"],[1,"#141A3A","#2A2D58"]];
function skyAt(p){
  for (let i = 0; i < SKY.length-1; i++){
    const a = SKY[i], b = SKY[i+1];
    if (p <= b[0]){ const t = (p - a[0])/(b[0]-a[0]); return [hexLerp(a[1],b[1],t), hexLerp(a[2],b[2],t)]; }
  }
  return [SKY[4][1], SKY[4][2]];
}

function percy(x, y, f, face){

/* ---------- Animation (runs even when paused) ---------- */
function animate(dt){
  if (bell.t > 0) bell.t -= dt;
  weather.t -= dt; if (weather.t <= 0){ weather.rain = !weather.rain; weather.t = weather.rain ? rand(15,30) : rand(18,35); }
  if (weather.rain) for (const d of drops){ d.y += d.s*dt; d.x -= d.s*0.15*dt; if (d.y > LH){ d.y = -5; d.x = rand(0, LW+40); } }
  for (const c of cars){ if (c.wait > 0){ c.wait -= dt; continue; } c.x += c.sp*dt; if (c.x > LW + 10){ c.x = -40; c.wait = rand(6,18); } }
  for (const c of clouds){ c.x += c.s*dt; if (c.x > LW + 10) { c.x = -c.w - 5; c.y = rand(6,60); } }
  for (const ws of W) for (const w of (ws || [])){
    if (w.mode !== "walk") continue;
    if (w.pause > 0){ w.pause -= dt; continue; }
    w.x += w.dir*w.sp*dt;
    if (w.x < w.lo){ w.x = w.lo; w.dir = 1; } if (w.x > w.hi){ w.x = w.hi; w.dir = -1; }
    if (Math.random() < dt*0.25){ w.pause = rand(1,3); if (Math.random() < .5) w.dir *= -1; }
  }
  const L = layout();
  const stops = [L.lobbyY + 18]; for (let i = 0; i < L.n; i++) stops.push(floorY(L,i) + 16);
  if (!elev.init){ elev.y = elev.ty = stops[0]; elev.init = true; }
  if (Math.abs(elev.ty - elev.y) < 0.5){ elev.y = elev.ty; elev.wait -= dt; if (elev.wait <= 0){ elev.ty = pick(stops); elev.wait = rand(1.5,3.5); } }
  else elev.y += Math.sign(elev.ty - elev.y)*Math.min(Math.abs(elev.ty-elev.y), 40*dt);
  if (!stops.some(s => s === elev.ty)) elev.ty = stops[0];
  const shown = S.claims.slice(0,6);
  shown.forEach((c,k) => {
    let u = CUST.find(u => u.id === c.id && u.state !== "out");
    if (!u){ u = {id:c.id, x:34, state:"wait", face:1, moving:false, mood:null,
      look:{skin:pick(SKINS), hair:pick(HAIRS), shirt:pick(CUST_SHIRTS), pants:pick(["#2B2D52","#4A6FA5","#6B4A2B","#3A3F6B"]), style:Math.random()<.5?0:1, hat:Math.random()<.6}};
      CUST.push(u); }
    u.tx = 140 - k*15;
  });
  for (const u of CUST){
    if (u.state === "wait" && !S.claims.some(c => c.id === u.id)) u.state = "out";
    if (u.state === "wait" && !shown.some(c => c.id === u.id)) u.state = "out";
    const tx = u.state === "out" ? 30 : u.tx;
    const d = tx - u.x;
    if (Math.abs(d) > 0.5){ u.x += Math.sign(d)*Math.min(Math.abs(d), (u.state==="out"?26:20)*dt); u.face = Math.sign(d); u.moving = true; }
    else { u.moving = false; if (u.state === "wait") u.face = 1; }
  }
  CUST = CUST.filter(u => !(u.state === "out" && u.x <= 31));
}

/* ---------- Simulation (paused while a panel is open) ---------- */
function update(dt){
  if (S.over) return;
  const inc = income(), up = upkeep();
  S.cash += (inc - up)*dt; S.q.prem += inc*dt; S.q.sal += up*dt; S.insured += inc*dt*0.04;
  for (const k in S.buffs) if (S.buffs[k] > 0) S.buffs[k] = Math.max(0, S.buffs[k] - dt);
  S.happy += (50 - S.happy)*0.004*dt;

  S.nextClaim -= dt;
  if (S.nextClaim <= 0){ spawnClaim(); S.nextClaim = claimInterval()*rand(0.6,1.4); }
  for (const c of [...S.claims]){ c.pat -= dt; if (c.pat <= 0) expireClaim(c); }
  for (const r of [...S.returns]){
    r.t -= dt;
    if (r.t <= 0){
      S.returns.splice(S.returns.indexOf(r),1);
      if (r.gaveUp){ mood(-4); toast(`${r.c.name} gave up on the paperwork. You kept the money. They kept a grudge.`); }
      else { S.claims.push({...r.c, pat:30, max:30}); toast(`${r.c.name} is back with the forms. In triplicate.`); }
    }
  }
  for (const l of [...S.lawsuits]){
    l.t -= dt;
    if (l.t <= 0){ S.lawsuits.splice(S.lawsuits.indexOf(l),1); spend(l.amt, "other"); S.sued = (S.sued || 0) + 1; fxShake(); toast(`Lawsuit lost: ${fmt(l.amt)}. ${pick(LAWSUIT_QUIPS)}`, "bad"); }
  }
  const L = layout();
  S.floors.forEach((f,i) => {
    if (f.type === "claims"){
      f._t = (f._t || 0) + dt*morale();
      if (f._t >= 14/f.level){ f._t = 0; if (S.claims.length){ const c = S.claims[0]; let m = f.mode; if (m === "smart") m = (lv("risk") >= 2 && legitEst(c) < 50) ? "deny" : "pay"; if (m === "deny" || S.cash >= c.amount) resolve(c, m, i); } }
    }
    if (f.type === "sales"){
      popT[i] = (popT[i] || 0) + dt;
      if (popT[i] >= 3){ popT[i] = 0; const amt = salesFloorRate(f.level)*salesMult()*(S.buffs.sales>0?2:1)*3; pop("+"+fmt(amt), 70 + Math.random()*60, floorY(L,i)+20, ""); }
    }
  });

  if (S.cash < 0 && !S.warnedNeg){ S.warnedNeg = true; toast(`You’re overdrawn. If cash drops below ${fmt(-overdraft())}, the bank takes the building.`, "bad"); }
  if (S.cash >= 0) S.warnedNeg = false;
  if (S.cash < -overdraft()){ gameOver(); return; }

  S.qt += dt;
  if (S.qt >= Q_LEN){ S.qt = 0; earnings(); return; }
  checkRank();
  S.nextEvent -= dt;
  if (S.nextEvent <= 0 && S.qt < Q_LEN - 6){ S.nextEvent = rand(40,65); fireEvent(); }
}

/* ---------- FX and toasts ---------- */
function pop(text, lx, ly, cls){
  if (!scene) return;
  cls = cls || "";
  const stamp = cls.includes("stamp"), bad = cls.includes("bad"), ok = cls.includes("ok");
  const style = {fontFamily:FONT, fontSize:pxL(stamp ? 14 : 16)+"px", fontStyle:"700", color: stamp ? "#FFFFFF" : bad ? "#FF6B6B" : "#4BE39A", resolution:Math.ceil(cz)};
  if (stamp){ style.backgroundColor = ok ? "#2FB879" : "#FF6B6B"; style.padding = {x:pxL(5), y:pxL(1)}; }
  else { style.stroke = "#12133A"; style.strokeThickness = pxL(3); }
  const t = scene.add.text(OX + lx, ly, text, style).setOrigin(0.5, 1).setDepth(30);
  if (stamp){ t.setAngle(-8); t.setScale(1.4); scene.tweens.add({targets:t, scale:1, duration:180, ease:"Back.easeOut"}); }

function upgrade(i, back){

/* Earnings */
function earnings(){
  const q = S.q; const profit = q.prem - q.paid - q.sal - q.other;
  const prev = S.lastProfit;
  const expected = (prev != null && prev > 0) ? Math.max(40, prev*1.12) : 40;
  const basis = (prev != null && prev > 0 && prev*1.12 > 40) ? `Last quarter’s ${fmt(prev)}, plus 12%. It’s always 12%.` : `Their minimum. They never accept less than ${fmt(40)}.`;
  const surprise = (profit - expected)/Math.max(Math.abs(expected), 40);
  let ch = clamp(surprise*0.2, -0.25, 0.35); const ir = lv("ir");
  if (ch > 0) ch *= 1 + 0.15*ir; else ch *= Math.max(0.3, 1 - 0.12*ir);
  const notes = [];
  if (S.aiHype){ ch += 0.06; notes.push("You said “AI” forty times. Analysts added 6% out of reflex."); S.aiHype = false; }
  if (S.happy < 25){ ch -= 0.05; notes.push("A sustainability fund sold your stock over customer complaints. Share price down 5%."); }
  if (S.happy < 20){ const fine = Math.round(Math.max(100, Math.max(0,S.cash)*0.15)); S.cash -= fine; notes.push(`The regulator is “concerned.” Fine: ${fmt(fine)}.`); }
  const old = S.stock; S.stock = Math.max(0.5, S.stock*(1+ch));
  S.hist.push(S.stock); if (S.hist.length > 40) S.hist.shift();
  const qn = S.quarter; S.quarter++; S.lastProfit = profit; S.q = blankQ();
  S.streak = profit >= expected ? (S.streak || 0) + 1 : 0;
  S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
  S.bestProfit = Math.max(S.bestProfit || 0, profit);
  const qLabel = `Q${((qn-1)%4)+1}, year ${Math.ceil(qn/4)}`;
  let lede, quote;
  if (profit < 0){ lede = "You lost money this quarter."; quote = pick(["“Is the building on fire? Asking for a client.”","“We’re downgrading you to ‘Hold your breath.’”","“Bold strategy. Incorrect, but bold.”"]); }
  else if (surprise < 0){ lede = `You missed the City’s expectations by ${fmt(expected-profit)}.`; quote = pick([`“You made ${fmt(profit)}. We expected ${fmt(expected)}. We are in mourning.”`,"“Disappointing. Have you tried firing someone?”","“A profit, sure. But was it enough profit?”"]); }
  else if (surprise > 0.3){ lede = "You crushed the City’s expectations."; quote = pick(["“Exceptional. Do it again, but more.”","“We’re upgrading you to ‘Buy, immediately, with both hands.’”","“I just named my son after your margins.”"]); }
  else { lede = "You beat the City’s expectations."; quote = pick(["“Solid quarter. Next time we’ll expect 12% more, for no reason.”","“Cautiously ecstatic.”","“Fine. Good, even. Don’t let it go to your head.”"]); }
  const pct = (S.stock/old - 1)*100;
  bell.t = 3; lede += profit >= expected ? " In The Room, the bell rings twice." : " In The Room, the bell rings once.";
  openModal(`<h2>Earnings call, ${qLabel}</h2>
    <p>${lede}${S.streak > 1 ? ` That’s ${S.streak} quarters in a row.` : ""}</p>
    <table class="ledger">
      <tr><td>Premiums collected</td><td class="pos">+${fmt(q.prem)}</td></tr>
      <tr><td>Claims paid</td><td class="neg">−${fmt(q.paid)}</td></tr>
      <tr><td>Salaries</td><td class="neg">−${fmt(q.sal)}</td></tr>
      <tr><td>Lawsuits, fines and “other”</td><td class="neg">−${fmt(q.other)}</td></tr>
      <tr class="total"><td>Profit</td><td class="${profit>=0?"pos":"neg"}">${fmt(profit)}</td></tr>
      <tr class="exp"><td>The City expected<br><small>${basis}</small></td><td>${fmt(expected)}</td></tr>
    </table>
    <div class="move ${pct>=0?"up":"down"}"><span>Share price<br><b>${fmt2(old)} to ${fmt2(S.stock)}</b></span><em>${pct>=0?"+":"−"}${Math.abs(pct).toFixed(1)}%</em></div>
    <blockquote>${quote}<cite>An analyst who has never bought insurance</cite></blockquote>
    ${notes.map(n => `<p class="note">${n}</p>`).join("")}
    <div class="closeRow"><button class="btn" data-act="close">Hang up</button></div>`, {locked:true, onClose:() => { checkRank(); save(); }});
}

function sue(a){ S.lawsuits.push({t:rand(12,25), amt:Math.round(a)}); }
function fireEvent(){
  if (!Array.isArray(S.recentEv)) S.recentEv = [];
  let pool = EVENTS.filter(e => (!e.cond || e.cond()) && !S.recentEv.includes(e.id));
  if (!pool.length) pool = EVENTS.filter(e => !e.cond || e.cond());
  const e = pick(pool); S.recentEv.push(e.id); if (S.recentEv.length > 22) S.recentEv.shift(); curEvent = e;
  const txt = typeof e.text === "function" ? e.text() : e.text;
  openModal(`<h2>${e.title}</h2><p>${txt}</p>
    <div class="choices">${e.choices.map((c,k) => `<button class="btn ${k?"ghost":""}" data-act="ev:${k}">${c.label()}</button>`).join("")}</div>`, {locked:true});
}

/* ---------- Click handling ---------- */
$("#sheet").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const [a, p, q] = b.dataset.act.split(":");
  if (a === "close") closeModal();
  else if (a === "build") build(p);
  else if (a === "up") upgrade(+p, q);
  else if (a === "floor") openFloor(+p);
  else if (a === "mode"){ S.floors[+p].mode = q; openFloor(+p); }
  else if (a === "skin"){ S.floors[+p].skin = +q; openFloor(+p); save(); }
  else if (a === "pay" || a === "deny" || a === "stall"){
    const c = S.claims.find(c => c.id === +p); if (!c) return;
    resolve(c, a, "you"); save();
    if (claimFocus) closeModal(); else openClaims();
  }
  else if (a === "ev"){
    const e = curEvent; if (!e) return;
    const res = e.choices[+p].run(); curEvent = null;
    openModal(`<h2>${e.title}</h2><p>${res}</p><div class="closeRow"><button class="btn" data-act="close">Back to work</button></div>`, {locked:true, onClose:() => { checkRank(); save(); }});
  }
  else if (a === "board") openBoard();
  else if (a === "buyback"){ if (doBuyback()){ toast("Shares bought back. Share price up 4%. Customers didn’t notice.", "good"); openBoard(); } }
  else if (a === "bonus"){
    const c = bonusCost(); if (S.cash < c) return;
    spend(c,"other"); S.yachts++; S.stock *= 0.99;
    toast(`You bought yacht #${S.yachts}: “${YACHTS[(S.yachts-1)%YACHTS.length]}.”`, "good"); openBoard();
  }
  else if (a === "restart") openBoard(true);
  else if (a === "restart-yes") restart();
});
$("#btnFloors").addEventListener("click", openFloors);
$("#btnClaims").addEventListener("click", () => openClaims());
$("#btnBoard").addEventListener("click", () => openBoard());

/* ---------- HUD ---------- */
const MOODS = [[80,"😊 Delighted"],[60,"🙂 Fine, actually"],[40,"😐 Tolerating you"],[20,"😠 Furious"],[0,"🔥 Pitchforks"]];
function hud(){
  $("#cash").textContent = fmt(S.cash);
  $("#cashBox").classList.toggle("neg", S.cash < 0);
  const net = income() - upkeep();
  let rate = `${net>=0?"+":"−"}${fmtR(Math.abs(net)).replace("−","")}/s`;
  if (S.buffs.sales > 0) rate += " ×2";
  $("#rate").textContent = rate + " income";
  $("#stock").textContent = fmt2(S.stock);
  const nx = RANKS[S.rankIdx+1];
  $("#rank").textContent = nx ? `${RANKS[S.rankIdx].name} (${nx.goals.filter(goalMet).length}/${nx.goals.length})` : RANKS[S.rankIdx].name;
  $("#happyBar").style.width = S.happy + "%";
  $("#happyTxt").textContent = MOODS.find(m => S.happy >= m[0])[1];
  const qn = S.quarter;

function frameSync(dt){

  for (const c of cloudObjs){ c.x += c._s*dt; if (c.x > LW + 10){ c.x = -30; c.y = rand(4, 62); } c.setTint(tint).setAlpha(p > 0.86 ? .5 : 1); }

    } else if (u.mood) kind = u.mood;
    if (kind) s.bub.setVisible(true).setTexture(SK("bub_"+kind)).setPosition(OX + Math.round(u.x) - 4, fyL - 24 - jump);
    else s.bub.setVisible(false);

  if (ly >= L.floorsTop && ly < L.lobbyY){ const k = Math.floor((ly - L.floorsTop)/FH); openFloor(L.n - 1 - k); return; }
  if (ly >= L.lobbyY && ly < L.groundY && lx >= 24 && lx <= 196){ openClaims(); return; }
  if (ly < TOP) openBoard();
}

class TowerScene extends Phaser.Scene {
  constructor(){ super("tower"); }
  create(){
    scene = this;
    const cam = this.cameras.main; cam.setOrigin(0, 0); cam.setZoom(cz);
    this.input.on("pointerdown", p => { drag = {y:p.y, sy:cam.scrollY, moved:false, lastY:p.y, lastT:performance.now()}; vel = 0; });
    this.input.on("pointermove", p => {
      if (!drag || !p.isDown) return;
      if (Math.abs(p.y - drag.y) > 7*dpr) drag.moved = true;
      if (drag.moved){
        cam.scrollY = clampScroll(drag.sy - (p.y - drag.y)/cam.zoom);
        const now = performance.now(), dtm = Math.max(1, now - drag.lastT);
        vel = -((p.y - drag.lastY)/cam.zoom)/(dtm/1000); drag.lastY = p.y; drag.lastT = now;
      }
    });
    this.input.on("pointerup", p => { if (drag && !drag.moved){ vel = 0; tapAt(p.worldX, p.worldY); } drag = null; });
    this.input.on("wheel", (p, over, dx, dy) => { vel = 0; cam.scrollY = clampScroll(cam.scrollY + dy*dpr/cam.zoom); });
    this.game.canvas.style.cursor = "pointer";
    rebuildAll();
  }
  update(_, dms){
    const dt = Math.min(0.1, dms/1000); time += dt;
    if (!modalOpen && !S.over) update(dt);
    animate(dt);
    if (towerKey() !== lastKey) rebuildAll();
    const cam = this.cameras.main;
    if (!drag && Math.abs(vel) > 2){ cam.scrollY = clampScroll(cam.scrollY + vel*dt); vel *= Math.pow(0.03, dt); }
    frameSync(dt);
    tick8 += dt; if (tick8 > 0.125){ tick8 = 0; redrawDynamic(); }
    tick2 += dt; if (tick2 > 0.5){ tick2 = 0; redrawSlow(); }
    hudT += dt; if (hudT > 0.1){ hud(); hudT = 0; }
    saveT += dt; if (saveT > 5){ save(); saveT = 0; }
  }
}
function measure(){
  const el = $("#game");
  cssW = Math.max(200, el.clientWidth); cssH = Math.max(200, el.clientHeight);
  dpr = Math.min(3, window.devicePixelRatio || 1);
  cz = cssW*dpr/LW; RS = Math.max(1, Math.ceil(cz));
}
function onResize(){
  if (!game) return;
  measure();
  game.scale.resize(Math.round(cssW*dpr), Math.round(cssH*dpr));
  game.scale.setZoom(1/dpr);
  if (scene){ scene.cameras.main.setZoom(cz); }
}
function boot(){
  if (!window.Phaser){ $("#game").innerHTML = `<p style="padding:20px;color:#fff">Phaser couldn’t load. Check your connection and reload.</p>`; return; }
  measure();
  game = new Phaser.Game({
    type: Phaser.AUTO, parent: "game", width: Math.round(cssW*dpr), height: Math.round(cssH*dpr),
    backgroundColor: "#9FB0C2", banner: false, antialias: true, pixelArt: false,
    scale: {mode: Phaser.Scale.NONE, zoom: 1/dpr},
    input: {mouse: {preventDefaultWheel: true}},
    scene: [TowerScene],
  });
  window.addEventListener("resize", () => { clearTimeout(boot._t); boot._t = setTimeout(onResize, 120); });
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
hud();
const fontReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('600 12px "Pixelify Sans"'), new Promise(r => setTimeout(r, 2500))]) : Promise.resolve();
fontReady.then(() => {
  boot();
  if (S.over) gameOver(); else if (!S.seen) intro();
});
})();
</script>
