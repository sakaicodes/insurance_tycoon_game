<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine Print Syndicate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&text=0123456789&display=swap" rel="stylesheet">
<style>
:root{
  --page:#9FB0C2; --panel:#24264F; --panel-2:#30336A; --edge:#12133A; --line:#3B3E7A;
  --ink:#FFFFFF; --ink-dim:#D0D3F7; --gold:#FFD23F; --money:#4BE39A; --danger:#FF6B6B; --pink:#FF8FB1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0E1030; color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#0E1030; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;overflow:hidden;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);box-shadow:0 0 0 3px var(--edge)}
.px{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif}



/* HUD */
.hud{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;padding:8px 8px 6px;background:var(--panel);border-bottom:3px solid var(--edge);font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif}
.stat{background:var(--panel-2);border:2px solid var(--edge);border-radius:6px;padding:5px 8px;min-width:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.07)}
.stat .k{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.01em}
.stat b{font-variant-numeric:tabular-nums lining-nums;display:block;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.stat small{display:block;font-size:13px;color:var(--ink-dim);line-height:1.25}
.cash b{color:var(--money)} .cash.neg b{color:var(--danger)}
.stock b{color:var(--gold)}
.bar{height:10px;background:var(--edge);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--pink);transition:width .4s}
.qrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim);padding:2px 2px 0}
.qbar{flex:1;height:8px;background:var(--edge);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--gold)}



/* Tower */
#towerWrap{flex:1;position:relative;overflow:hidden;background:#9FB0C2;touch-action:none;min-height:0}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}
#towerInner{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
#stage{position:relative}
canvas{display:block;width:100%;cursor:pointer;image-rendering:pixelated;touch-action:manipulation}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-weight:700;font-size:16px;color:var(--money);white-space:nowrap;
  text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge);animation:rise 1.4s ease-out forwards}
.pop.bad{color:var(--danger)}
.pop.stamp{color:#fff;background:var(--danger);padding:0 6px;border:2px solid var(--edge);text-shadow:none;rotate:-8deg;font-size:14px}
.pop.stamp.ok{background:#2FB879}
@keyframes rise{from{opacity:1;transform:translate(-50%,-100%)}to{opacity:0;transform:translate(-50%,-280%)}}



/* Dock */
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 8px 10px;background:var(--panel);border-top:3px solid var(--edge)}
.btn{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-weight:600;font-size:17px;line-height:1.1;color:#2A1E00;background:var(--gold);border:3px solid var(--edge);border-radius:7px;padding:10px 12px;box-shadow:0 4px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.45);cursor:pointer;position:relative;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15)}
.btn:disabled{filter:grayscale(.85) brightness(.75);cursor:not-allowed}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.green{background:#4BE39A}
.btn.red{background:#FF7A7A}
.btn.ghost{background:#C9CCF5}
.btn.blue{background:#7FD3F7}
.btn small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.badge{display:inline-block;min-width:22px;padding:1px 6px;margin-left:4px;border-radius:999px;background:var(--edge);color:#fff;font-size:14px}
.btn.hot .badge{background:var(--danger);animation:thump 1s steps(2) infinite}
@keyframes thump{50%{transform:scale(1.15)}}



/* Toasts */
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 124px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--panel);border:3px solid var(--edge);border-left:8px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--edge);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--danger)} .toast.good{border-left-color:var(--money)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}



/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,40,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#modal[hidden]{display:none}


@media (min-width:700px){#modal{align-items:center}}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;overflow-anchor:none;width:min(520px,100%);max-height:min(86vh,740px);overflow-y:auto;background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--line);padding:18px 18px 20px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-size:27px;margin:0 0 8px;color:var(--gold);font-weight:700;line-height:1.12}
.sheet h3{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-size:19px;margin:0 0 4px;font-weight:600}
.sheet p{margin:0 0 12px;line-height:1.5;font-size:16px;max-width:62ch}
.sheet .dim{color:var(--ink-dim);font-size:15px}
.sheet .joke{color:var(--ink-dim);font-style:italic;font-size:15px}
.closeRow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}


#coach{position:fixed;inset:0;z-index:60}
#coach[hidden]{display:none}
.coach-hole{position:fixed;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 9999px rgba(8,9,32,.74);transition:all .3s ease;pointer-events:none}
.coach-card{position:fixed;background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--line);padding:14px 16px;transition:top .3s ease,left .3s ease}
.coach-card h3{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:21px;font-weight:700;color:var(--gold);margin:0 0 6px}
.coach-card p{margin:0 0 12px;font-size:15px;line-height:1.45}
.coach-card .coach-step{font-size:13px;color:var(--ink-dim);margin:0 0 2px}
.coach-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coach-btns .btn{font-size:15px;padding:8px 12px}
.coach-dots{display:flex;gap:4px;margin:0 0 10px}
.coach-dots i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.2)}
.coach-dots i.on{background:var(--gold)}


.score{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:12px;margin:0 0 12px}
.score-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.score-total{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:36px;font-weight:700;color:#fff;line-height:1.1}
.grade{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:46px;font-weight:700;line-height:1;color:var(--gold);width:66px;height:66px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:10px;box-shadow:0 4px 0 var(--edge)}
.grade{font-family:"Rubik",system-ui,sans-serif;font-weight:700}


#lawBtn{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--danger);border:2px solid var(--edge);border-radius:6px;padding:2px 7px;cursor:pointer;box-shadow:0 2px 0 var(--edge)}
#lawBtn[hidden]{display:none}
#lawBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#rate.warn{color:var(--danger);font-weight:600;animation:blink 1s steps(2) infinite}
.qbar.conf.danger{box-shadow:0 0 0 2px var(--danger);animation:pulse 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,107,107,.35)}}
.law{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:9px 11px;margin:0 0 8px}
.law div{flex:1;min-width:0} .law b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px} .law p{margin:2px 0 0!important;font-size:14px!important;color:var(--ink-dim)}
.law .btn{flex:none;font-size:14px;padding:7px 10px}
.seg.four{grid-template-columns:repeat(4,1fr)} .seg.four .btn{font-size:14px;padding:8px 4px}
@media (prefers-reduced-motion: reduce){ #rate.warn,.qbar.conf.danger{animation:none} }
.newbest{color:var(--money);font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px}
.score .ledger{margin:10px 0 0}
@media (prefers-reduced-motion: reduce){ .coach-hole,.coach-card{transition:none} }
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{background:none;border:0;color:var(--ink-dim);font-size:26px;line-height:1;cursor:pointer;padding:0 4px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.x:focus-visible{outline:3px solid #fff;border-radius:4px}

.claim{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:12px;margin:0 0 10px}
.claim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.claim-top b{font-size:18px}
.amt{color:var(--gold);font-size:20px;font-weight:700}
.claim p{margin:6px 0 8px;font-size:16px}
.pat{height:7px;background:var(--edge);border-radius:3px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--money)}
.pat.low i{background:var(--danger)}
.patlbl{display:block;font-size:13px;color:var(--ink-dim);margin:3px 0 10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row3 .btn{font-size:15px;padding:9px 6px}
.empty{text-align:center;padding:22px 8px;color:var(--ink-dim)}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.type{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.type:hover:not(:disabled){border-color:var(--gold)}
.type:focus-visible{outline:3px solid #fff}
.type:disabled{opacity:.5;cursor:not-allowed}
.type .sw{height:16px;border-radius:3px;border:2px solid var(--edge)}
.type b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.type span{font-size:14px;line-height:1.4;color:var(--ink-dim)}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.frow .sw{width:14px;align-self:stretch;border-radius:3px;border:2px solid var(--edge)}
.frow .nm{flex:1;min-width:0;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px}
.frow .btn{font-size:14px;padding:7px 9px}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:9px;height:9px;background:rgba(255,255,255,.2);border:1px solid var(--edge)}
.pips i.on{background:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.fact span{display:block;font-size:14px;color:var(--ink-dim)}
.fact b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.seg .btn{font-size:15px}
.seg .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}
.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 6px}
.designs .btn{font-size:14px;padding:8px 6px}
.intel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.intel div{background:rgba(0,0,0,.22);border:2px solid var(--edge);border-radius:6px;padding:5px 7px;min-width:0}
.intel span{display:block;font-size:13px;color:var(--ink-dim)}
.intel b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px;font-weight:600}
.intel .lock{color:var(--ink-dim);font-size:13px;font-family:"Rubik",sans-serif;font-weight:500}
.intel .bad,.intel .sev3{color:var(--danger)} .intel .good,.intel .sev1{color:var(--money)} .intel .sev2{color:var(--gold)}
.sheet .intel-hint{font-size:14px;color:var(--ink-dim);margin:0 0 10px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.designs .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}

.ledger{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.ledger td{padding:6px 0;border-bottom:2px dashed var(--line)}
.ledger td:last-child{text-align:right;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.ledger tr.total td{border-bottom:0;font-weight:700;padding-top:10px}
.ledger tr.total td:last-child{font-size:21px}
.ledger tr.exp td{color:var(--ink-dim);border-bottom:0}
.pos{color:var(--money)} .neg{color:var(--danger)}
.move{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.move b{font-size:20px} .move em{font-style:normal;font-size:24px;font-weight:700}
.move.up em{color:var(--money)} .move.down em{color:var(--danger)}
blockquote{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--gold);background:rgba(255,255,255,.05);font-size:16px;line-height:1.45;border-radius:0 6px 6px 0}
blockquote cite{display:block;font-style:normal;color:var(--ink-dim);font-size:14px;margin-top:4px}
.note{background:rgba(255,107,107,.12);border:2px solid rgba(255,107,107,.4);border-radius:6px;padding:8px 10px;font-size:14px!important}
.big{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:48px;color:var(--gold);line-height:1;margin:6px 0 8px}
.spark{width:100%;height:80px;display:block;margin:6px 0 4px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px}
.action{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.action p{margin:0;font-size:15px;color:var(--ink-dim)}
.action .btn{flex:none;font-size:15px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choices .btn{text-align:left;font-size:17px}


.pbtn{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:14px;font-weight:600;color:#2A1E00;background:var(--gold);border:2px solid var(--edge);border-radius:6px;padding:3px 9px;box-shadow:0 2px 0 var(--edge);cursor:pointer}
.pbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pbtn.on{background:var(--money)}
.qbar.conf i{background:var(--money);transition:width .4s,background .4s}
#mktTxt{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-weight:600}
#pauseOv{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(18,19,58,.55);backdrop-filter:blur(2px);cursor:pointer}
#pauseOv[hidden]{display:none}
#pauseOv div{background:var(--panel);border:3px solid var(--edge);border-radius:10px;padding:16px 26px;text-align:center;box-shadow:0 5px 0 var(--edge)}
#pauseOv b{display:block;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:30px;color:var(--gold)}
#pauseOv span{font-size:15px;color:var(--ink-dim)}
.sheet.intro h2{font-size:23px}
.sheet.intro p{font-size:15px;line-height:1.45}
.intro-scroll{max-height:min(42vh,320px);overflow-y:auto;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.intro-scroll p{display:flex;gap:9px;align-items:flex-start;margin:0 0 10px;font-size:14px!important;line-height:1.4}
.intro-scroll p:last-child{margin-bottom:0}
.intro-scroll .intro-h{font-size:17px;color:var(--gold);margin:14px 0 8px;padding-top:10px;border-top:2px dashed var(--line)}
.intro-scroll .isw{flex:none;width:14px;height:14px;margin-top:3px;border:2px solid var(--edge);border-radius:3px}
.intro-scroll .intro-room em{display:block;font-style:normal;margin-top:2px}
.intro-scroll .intro-room em.pro{color:var(--money)}
.intro-scroll .intro-room em.con{color:#FF9B9B}
.intro-scroll .intro-tip{background:rgba(255,210,63,.1);border-radius:6px;padding:6px 8px}
.intro-scroll p span:first-child{flex:none;font-size:18px;line-height:1.2}


.type .pro,.pc .pro{color:var(--money)} .type .con,.pc .con{color:#FF9B9B}
.pc{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;margin:0 0 12px}
.pc p{margin:0 0 4px!important;font-size:15px!important} .pc p:last-child{margin:0!important}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold);text-align:center;margin:0 0 6px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.reward{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 12px}
.reward div{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:6px 8px}
.reward span{display:block;font-size:13px;color:var(--ink-dim)} .reward b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.ach{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:7px 9px;font-size:14px;opacity:.55}
.ach.on{opacity:1;border-color:var(--gold)} .ach b{display:block;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:15px}
.swan h2{color:var(--danger)!important}
.status{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.status div{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:6px 8px}
.status span{display:block;font-size:13px;color:var(--ink-dim)} .status b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.goals{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:16px;line-height:1.3}
.goals li i{flex:none;width:20px;height:20px;border:2px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-weight:700;color:#12133A}
.goals li.ok i{background:var(--money)}
.goals li span{flex:1}
.goals li b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;color:var(--ink-dim);white-space:nowrap}
.goals li.ok b{color:var(--money)}
.ledger small{font-size:13px;color:var(--ink-dim)}
.howto p{display:flex;gap:10px;align-items:flex-start}

/* Repeatable star purchases, so stars stay useful after every perk is owned. */
const STAR_SHOP = [

function palm(x, base, lean, t, k){
  for (let i = 0; i < 26; i++){ const a = lean*(i/26)*(i/26); P(x + Math.sin(a)*i, base - Math.cos(a)*i, 2, 1, i % 4 === 0 ? "#8E6A3E" : "#A8824E"); }
  const tx = x + Math.sin(lean)*26, ty = base - Math.cos(lean)*26;
  for (let f = 0; f < 5; f++){ const ang = lean*1.6 + (f - 2)*0.35 + Math.sin(t*14 + f + k)*0.12; for (let i = 0; i < 12; i++){ const fx = tx + Math.sin(ang + 1.2)*i*1.1, fy = ty - Math.cos(ang + 1.2)*i*0.6 + i*i*0.03; P(fx, fy, 2, 1.4, i < 6 ? "#3E8A3A" : "#5DB04A"); } }
  disc(tx, ty, 2, "#6E5030");
}
function cloudPuff(x, y, w, col, shadow){ oval(x, y, w, w*0.45, col); oval(x - w*0.5, y + 2, w*0.6, w*0.3, col); oval(x + w*0.55, y + 2, w*0.55, w*0.28, col); P(x - w, y + w*0.3, w*2, 1, shadow); }
function cityBlock(x, base, w, h, col, lit, night, seed){
  P(x, base - h, w, h, col); P(x, base - h, w, 1, shadeC(col, 0.18));
  for (let yy = base - h + 3; yy < base - 2; yy += 4) for (let xx = x + 2; xx < x + w - 1; xx += 3) if (hs(xx + seed, yy) < lit) P(xx, yy, 1.5, 2, night ? "#FFE18A" : "#CFE6F2");
}

/* game/economy.js - part of Fine Print Syndicate. Bundled into one HTML file by build.js. */
/* ---------- Economy ---------- */
function lv(t){ let s = 0; for (const f of S.floors) if (f.type === t) s += f.level; return s; }
function morale(){ return (1 + 0.08*lv("breakroom") + 0.05*lv("hr") + (S.buffs.morale > 0 ? 0.3 : 0) + (perk("espresso") ? 0.05 : 0))*(S.hrSlump > 0 ? 0.75 : 1); }
function happyMult(){ const base = clamp(1 + (S.happy - 50)*0.012, 0.4, 1.6); return 1 + (base - 1)*mixAvg("mood"); }
function salesFloorRate(level){ return 5.5*Math.pow(level,1.38); }
function exposureRate(level){ return 5.5*Math.pow(level,1.27); }
function exposure(){ let s = 0; for (const f of S.floors) if (f.type === "sales") s += exposureRate(f.level); return s*salesMult()*volume(); }
function salesMult(){ return (1 + 0.05*Math.min(4, S.tickets || 0)) * (1 + 0.35*lv("marketing") + 0.10*lv("it") + 0.05*lv("hr") + (perk("loyalty") ? 0.1 : 0)) * happyMult() * morale() * Math.max(0.5, 1 - 0.03*lv("risk") - 0.04*lv("compliance")); }
function cycleVal(){ return Math.sin(S.cyc || 0); }
function cycleName(){ const c = cycleVal(); return c > 0.35 ? "Hard market" : c < -0.35 ? "Soft market" : "Steady market"; }
function priceIdx(){ return S.price == null ? 1 : S.price; }
function marketRate(){ return PRICES[priceIdx()].p*(1 + 0.25*cycleVal()); }
function businessScale(){ const lv = S.floors.reduce((a, f) => a + (f.type === "penthouse" ? 0 : f.level), 0); return 0.7 + 0.3*Math.min(1, lv/25); }
function divBonus(){ const n = Object.keys(bookMix()).length; return 1 + Math.min(0.3, 0.06*Math.max(0, n - 1)); }
function volume(){ const e = 1.0 - 0.4*cycleVal(); return Math.max(0.35, 1 - e*(PRICES[priceIdx()].p - 1))*businessScale(); }
function maturity(){ return Math.min(1, S.floors.reduce((a, f) => a + (f.type === "penthouse" ? 0 : f.level), 0)/70); }
function pricingBoost(){ return 1 + Math.min(0.4, 0.06*lvSpec("actuary", "pricing")); }
function baseIncome(){ let s = 0; for (const f of S.floors) if (f.type === "sales") s += salesFloorRate(f.level)*LINES[fSpec(f)].rate*cityLine(fSpec(f)); return s*salesMult()*marketRate()*volume()*pricingBoost()*divBonus(); }
function income(){ return baseIncome() * (S.buffs.sales > 0 ? 2 : 1) * (S.outage > 0 ? 0.5 : 1); }
function salFactor(){ return 1 + 0.06*workFloors(); }
function upkeep(){ let s = 0; for (const f of S.floors) s += (TYPES[f.type].sal || 0.6)*f.level; return s*salFactor() + execCost(); }
function perk(id){ return !!(S.perks && S.perks[id]); }
function claimSizeMult(){ return (1 + 0.10*lv("marketing"))*(0.9 + 0.1*S.diff); }
function claimSpeed(){ return morale()*(1 + 0.15*lv("it")); }
function regCreep(){ return Math.floor((S.quarter - 1)/8); }
function compNeed(){ return Math.max(0, workFloors() - 3 + Math.max(0, lv("breakroom") - lv("hr")) + regCreep() + (lv("invest") && S.invRisk === 2 ? 1 : 0)); }
function isUnlocked(t){ return !UNLOCKS[t] || !!(S.unlocked && S.unlocked[t]) || S.floors.some(f => f.type === t) || UNLOCKS[t].test(); }
function checkUnlocks(){
  if (!S.unlocked) S.unlocked = {};
  for (const t of ORDER){
    const u = UNLOCKS[t]; if (!u || S.unlocked[t]) continue;
    if (S.floors.some(f => f.type === t) || u.test()){ S.unlocked[t] = true; if (S.seen){ toast(`New floor unlocked: ${TYPES[t].name}. ${u.why}`, "good"); sfx("chime"); } }
  }
}
function capReq(){
  if (S.quarter < 6) return 0;
  const ramp = Math.min(1, (S.quarter - 5)/8), annual = Math.max(0, baseIncome())*Q_LEN*4;
  const risk = (S.cover && S.cover.cat ? 0.8 : 1)*(1 - Math.min(0.4, 0.06*lvSpec("actuary", "capital")))*(lv("invest") && S.invRisk === 2 ? 1.15 : 1)*(1 + 0.1*Math.max(0, S.diff - 1));
  return Math.round(annual*(0.08 + 0.32*maturity())*risk*ramp/10)*10;
}
function capRatio(){ const r = capReq(); return r ? Math.max(0, S.cash)/r : Infinity; }
let curRival = null;
function lunchOdds(){ return Math.min(0.9, 0.4 + 0.15*lv("marketing")); }
function hrOdds(){ return Math.min(0.9, 0.5 + 0.1*lv("hr")); }
function rivalPoach(){
  const targets = S.floors.map((f, i) => ({f, i})).filter(x => (x.f.type === "sales" || x.f.type === "marketing") && x.f.level >= 2);
  if (!targets.length) return;
  const t = pick(targets), name = pick(RIVALS), cost = Math.round(B()*0.8*(1 + 0.2*Math.max(0, S.diff - 2))/10)*10;
  const who = t.f.type === "sales" ? "your best underwriters" : "your favourite brokers";
  curRival = {i:t.i, name, cost};
  sfx("warn");
  if (hasExec("cos")){ resolveRival(S.cash - cost > execBuffer() ? 0 : lv("marketing") ? 1 : 3, true); return; }
  openModal(`<h2>🦈 ${name} is poaching</h2><p>A rival syndicate is trying to hire ${who} away from your ${TYPES[t.f.type].name} (level ${t.f.level}). If they go, that floor drops a level.</p>
    <div class="choices">
      <button class="btn" data-act="rival:0" ${S.cash < cost ? "disabled" : ""}>Match their offer (${fmt(cost)})</button>
      <button class="btn ghost" data-act="rival:1" ${!lv("marketing") ? "disabled" : ""}>Take them to a long lunch (${lv("marketing") ? Math.round(lunchOdds()*100) + "% chance" : "needs Broker Lunches"})</button>
      <button class="btn ghost" data-act="rival:2" ${!lv("hr") || S.cash < cost/2 ? "disabled" : ""}>Ask HR for a retention deal (${fmt(Math.round(cost/2))}${lv("hr") ? ", " + Math.round(hrOdds()*100) + "% chance" : ", needs HR"})</button>
      <button class="btn ghost" data-act="rival:3">Let them go</button>
    </div>`, {locked:true});
}
function resolveRival(k, auto){
  const r = curRival; curRival = null; if (!r) return;
  const f = S.floors[r.i]; if (!f) return;
  let kept = false, msg;
  if (k === 0){ spend(r.cost, "other"); kept = true; msg = `You matched ${r.name}’s offer. Everyone stays, now slightly richer.`; }
  else if (k === 1){ kept = Math.random() < lunchOdds(); msg = kept ? `Four hours, three courses and a cheese trolley later, nobody remembers ${r.name}’s offer.` : `The lunch was lovely. They still left for ${r.name}.`; }
  else if (k === 2){ spend(Math.round(r.cost/2), "other"); kept = Math.random() < hrOdds(); msg = kept ? "HR found a retention bonus and a nicer chair. They’re staying." : `HR’s retention plan was a branded mug. They left for ${r.name}.`; }

  if (auto){ toast(`${r.name} tried to poach your staff. ${msg}`, kept ? "good" : "bad"); save(); return; }
  openModal(`<h2>🦈 ${r.name}</h2><p>${msg}</p><div class="closeRow"><button class="btn" data-act="close">Back to work</button></div>`, {locked:true, onClose:() => save()});
}
function demoRefund(f){ let c = 0; for (let l = 1; l < f.level; l++) c += TYPES[f.type].up*Math.pow(1.9, l); return Math.round((c*0.2 + buildCost()*0.05)/10)*10; }
function prDamp(){ return 1 - Math.min(0.5, 0.1*lv("pr")); }
function prCost(){ return Math.round(B()*0.6/10)*10; }
function invCap(){ return Math.round(lv("invest")*Math.max(300, income()*Q_LEN*0.3)); }
function invCapital(){ return Math.max(0, Math.min(S.cash, invCap())); }
function gauss(){ let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function compHave(){ return 3*lv("compliance"); }
function compGap(){ return compNeed() - compHave(); }
function maxStrikes(){ return perk("lobbyist") ? 4 : 3; }
function growthRate(){ return Math.max(0.01, (0.06 + 0.04*S.diff + 0.02*lv("ir") - (perk("dinners") ? 0.03 : 0))*(1 - 0.85*maturity())); }
function mktName(){ return S.diff < 1.6 ? "Calm market" : S.diff < 2.3 ? "Choppy market" : S.diff < 3.1 ? "Stormy market" : S.diff < 4 ? "Brutal market" : S.diff < 5 ? "Cutthroat market" : "Feeding frenzy"; }
function actRed(){ return Math.min(0.4, 0.06*lvSpec("actuary", "reserving")); }
function buildCost(){ const n = workFloors() - 1; return Math.round(100*Math.pow(1.6, Math.min(n, 13))*Math.pow(1.25, Math.max(0, n - 13))); }
function upCost(f){ return Math.round(TYPES[f.type].up*Math.pow(1.9, f.level)); }
function claimInterval(){ return Math.max(3.5, 20/(1 + 0.12*lv("sales"))/(0.8 + 0.2*S.diff))/volume()/mixAvg("freq") * (S.buffs.surge > 0 ? 0.35 : 1); }
function B(){ return Math.max(120, Math.round(baseIncome()*25/10)*10); }
function canPay(a){ return S.cash - a >= -overdraft()*0.6; }

function buybackCost(){ return Math.round(S.stock*40); }
function bonusCost(){ return Math.round(S.stock*20 + 200); }
function goalMet(g){ return GOAL[g[0]].cur() >= g[1]; }
function goalsHtml(next){
  if (!next) return `<p>No titles left. You own the weather.</p>`;
  const rows = next.goals.map(g => { const d = GOAL[g[0]], ok = goalMet(g);
    return `<li class="${ok?"ok":""}"><i>${ok?"✓":""}</i><span>${d.label(g[1])}</span><b>${d.show(d.cur())}</b></li>`; }).join("");
  const done = next.goals.filter(goalMet).length;

  return `<h3>Next promotion: ${next.name} (${done} of ${next.goals.length})</h3><ul class="goals">${rows}</ul><p class="dim">Reward: +10 board confidence, +2 ★${unl.length ? `, and you can hire a ${unl.join(" and a ")}` : ""}.</p><p class="dim">All of these need to be true at the same time. The board is always watching.</p>`;

function pickFresh(arr, key, keep){
  if (!Array.isArray(S[key])) S[key] = [];
  let idx = arr.map((_,i) => i).filter(i => !S[key].includes(i));
  if (!idx.length) idx = arr.map((_,i) => i);
  const i = pick(idx); S[key].push(i); if (S[key].length > keep) S[key].shift();

function mood(d){ S.happy = clamp(S.happy + d, 0, 100); }
function spend(a, cat){ S.cash -= a; S.q[cat] += a; }
function gain(a){ S.cash += a; S.q.prem += a; S.earned = (S.earned || 0) + a; }

function addClaim(name, desc, amount, line){
  const nc = {id:S.claimId++, name, desc, line:line || "property", amount:Math.max(25, Math.round(amount/5)*5), pat:40, max:40, stalls:0};
  ensureIntel(nc); S.claims.push(nc);
  if (!S.tipClaim){ S.tipClaim = true; toast("A broker just walked into The Room with a claim. Tap them, or open Claims."); }
}
function typicalClaim(){ return Math.max(25, Math.max(3, exposure()/volume())*Math.max(3.5, 20/(1 + 0.12*lv("sales"))/(0.8 + 0.2*S.diff))*0.55*(1-actRed())*claimSizeMult()*mixAvg("size")); }
function ensureIntel(c){
  if (c.sev != null) return;
  const r = c.amount / (typicalClaim()*(c.line && LINES[c.line] ? LINES[c.line].size/Math.max(0.3, mixAvg("size")) : 1));
  c.sev = r < 0.8 ? 1 : r < 1.25 ? 2 : 3;
  c.lp = Math.random() < Math.max(0.45, 0.75 - 0.05*(S.diff - 1)) ? rand(0.68, 0.98) : rand(0.05, 0.45);
  c.legit = Math.random() < c.lp;
  c.lit = rand(-0.08, 0.12);

function estCenter(p, nz, sp){ return clamp(p*100 + nz*sp/2, 0, 100); }
function legitEst(c){ ensureIntel(c); return estCenter(c.lp, c.nz1, intelSpread(lv("risk"))); }
function legitFactor(lp){ return Math.pow(clamp((lp - 0.3)/0.65, 0, 1), 1.5); }

    <div><span>Sues if denied</span>${n >= 3 ? `<b class="${sc >= 35 ? "bad" : "good"}">${estText(suePct(c), c.nz2, sp)}</b>` : lock(3)}</div>
  </div>`;
}
function spawnClaim(){
  const inc = Math.max(3, exposure()*marketRate());
  const amt = inc*claimInterval()*0.55*rand(0.5,1.5)*(1-actRed())*claimSizeMult() / (S.buffs.surge > 0 ? 0.35 : 1) / marketRate();
  const mix = bookMix(), keys = Object.keys(mix); let line = "property";
  if (keys.length){ let r = Math.random()*keys.reduce((t, k) => t + mix[k]*LINES[k].freq, 0); for (const k of keys){ r -= mix[k]*LINES[k].freq; if (r <= 0){ line = k; break; } line = k; } }
  const lineAmt = amt*LINES[line].size;
  if (Math.random() < 0.10){ const n = pickFresh(NAMED, "recentNamed", 6); addClaim(n[0], n[1], lineAmt, line); }
  else addClaim(pickFresh(NAMES.concat(MORE_NAMES), "recentNm", 40), lineIncident(line), lineAmt, line);

/* game/claims.js - part of Fine Print Syndicate. Bundled into one HTML file by build.js. */
/* ---------- Claims ---------- */
function custFor(id){ return CUST.find(u => u.id === id && u.state !== "out"); }
function resolve(c, action, src){
  const idx = S.claims.indexOf(c); if (idx < 0) return;
  S.claims.splice(idx,1);
  const u = custFor(c.id);
  const L = layout();
  const lobby = src === "you" || src === "exec";
  const fxX = lobby ? (u ? u.x : 110) : 100;
  const fxY = lobby ? L.lobbyY + 22 : floorY(L, src) + 18;
  const who = src === "you" ? "You" : src === "exec" ? "Your Head of Claims" : "Your Claims Office";
  ensureIntel(c);
  if (action === "pay"){
    spend(c.amount, "paid"); S.served++; sfx("pay");
    if (c.legit) mood(2.5);
    else { mood(0.5); S.fraudPaid = (S.fraudPaid || 0) + 1; if (src === "you" || Math.random() < .4) toast(`${who} paid ${c.name}’s ${fmt(c.amount)} claim (“${snip(c.desc)}”). It was fraud: ${pick(FRAUD_QUIPS)}.`, "bad"); }
    if (lobby) pop("−"+fmt(c.amount), fxX, fxY, "bad"); else pop("Paid", fxX, fxY, "stamp ok");
    if (u) u.mood = "happy";
  } else if (action === "deny"){
    const lg = lv("legal"); sfx("stamp");
    if (c.legit) mood(-7*SEV_MULT[c.sev-1]*Math.max(0.3, 1 - 0.12*lg));
    else { mood(-1); S.fraudCaught = (S.fraudCaught || 0) + 1; if (src === "you") toast(`Good call. ${c.name}’s claim (“${snip(c.desc)}”) was fraud: ${pick(FRAUD_QUIPS)}.`, "good"); }
    const chance = suePct(c);
    if (Math.random() < chance){
      S.lawsuits.push({t:rand(15,35), amt:Math.round(c.amount*(2 + c.sev*0.5)), win:courtWin(c), name:c.name});
      if (src === "you") toast(`${c.name} called a lawyer on the way out. This could get expensive.`, "bad");
    }
    pop(c.legit ? "Denied" : "Fraud!", fxX, fxY, c.legit ? "stamp" : "stamp ok");
    if (u) u.mood = "angry";
  } else if (action === "stall"){
    c.stalls++; sfx("paper");
    if (Math.random() < 0.65) S.returns.push({t:rand(18,30), c});
    else S.returns.push({t:rand(6,12), c, gaveUp:true});
    pop("Form 27-B", fxX, fxY, "stamp ok");
    if (u) u.mood = "confused";
  }
  if (u) u.state = "out";
}
function expireClaim(c){
  const i = S.claims.indexOf(c); if (i >= 0) S.claims.splice(i,1);
  const u = custFor(c.id); if (u){ u.mood = "angry"; u.state = "out"; }
  ensureIntel(c); mood(-8*SEV_MULT[c.sev-1]);
  if (Math.random() < 0.4){ const f = Math.round(c.amount); spend(f, "other"); toast(`${c.name} got tired of waiting and complained to the regulator. Fine: ${fmt(f)}.`, "bad"); }
  else toast(`${c.name} got tired of waiting and left a review: “${pick(REVIEWS)}”`, "bad");
}

    beard:facial < 0.2 ? hair : null, mo:facial >= 0.2 && facial < 0.3 ? hair : null,

function rebuildWorkers(i){
  const f = S.floors[i]; const n = f.type === "penthouse" ? 0 : Math.min(5, f.level + 1); const arr = [];
  const walk = f.type === "breakroom" || f.type === "ir";
  for (let k = 0; k < n; k++){
    const look = makeLook(f.type);
    if (walk){

  }
  if (f.type === "marketing") arr.push({mode:"walk", percy:true, x:100, lo:36, hi:166, dir:1, sp:9, pause:0});
  W[i] = arr;
}
S.floors.forEach((f,i) => rebuildWorkers(i));

/* ---------- Layout ---------- */
const LW = 232, OX = 6, FH = 40, TOP = 82, LOBBY_H = 44, GROUND = 24;
function layout(){
  const n = S.floors.length, can = workFloors() < MAXF, ph = n > 0 && S.floors[n-1].type === "penthouse", nw = n - (ph ? 1 : 0);
  const slotY = TOP + (ph ? FH : 0);            // the penthouse sits directly under the roof, above the build slot
  const floorsTop = slotY + (can ? FH : 0);
  const lobbyY = floorsTop + nw*FH;
  const groundY = lobbyY + LOBBY_H;
  return {n, nw, ph, slotY, can, floorsTop, lobbyY, groundY, LH:groundY + GROUND};
}
function floorY(L, i){ return L.ph && i === L.n - 1 ? TOP : L.floorsTop + (L.nw-1-i)*FH; }

let ctx = null, LH = 0;
function R(x,y,w,h,c){ ctx.fillStyle = c; ctx.fillRect(x,y,w,h); }
function T(str,x,y,size,color,align="left",weight=600){

  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = "alphabetic"; ctx.fillText(str,x,y);
}
function hexLerp(a,b,t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const r = Math.round(((pa>>16)&255)*(1-t) + ((pb>>16)&255)*t);
  const g = Math.round(((pa>>8)&255)*(1-t) + ((pb>>8)&255)*t);
  const bl = Math.round((pa&255)*(1-t) + (pb&255)*t);
  return `rgb(${r},${g},${bl})`;
}
function skyAt(p){
  for (let i = 0; i < SKY.length-1; i++){
    const a = SKY[i], b = SKY[i+1];
    if (p <= b[0]){ const t = (p - a[0])/(b[0]-a[0]); return [hexLerp(a[1],b[1],t), hexLerp(a[2],b[2],t)]; }

  if (weather.rain) for (const d of drops){ d.y += d.s*dt; d.x -= d.s*0.15*dt; if (d.y > LH){ d.y = -5; d.x = rand(0, LW+40); } }
  for (const c of cars){ if (c.wait > 0){ c.wait -= dt; continue; } c.x += c.sp*dt; if (c.x > LW + 10){ c.x = -40; c.wait = rand(6,18); } }
  for (const c of clouds){ c.x += c.s*dt; if (c.x > LW + 10) { c.x = -c.w - 5; c.y = rand(6,60); } }
  for (const ws of W) for (const w of (ws || [])){
    if (w.mode !== "walk") continue;
    if (w.pause > 0){ w.pause -= dt; continue; }
    w.x += w.dir*w.sp*dt;
    if (w.x < w.lo){ w.x = w.lo; w.dir = 1; } if (w.x > w.hi){ w.x = w.hi; w.dir = -1; }
    if (Math.random() < dt*0.25){ w.pause = rand(1,3); if (Math.random() < .5) w.dir *= -1; }
  }
  const L = layout();
  const stops = [L.lobbyY + 18]; for (let i = 0; i < L.n; i++) stops.push(floorY(L,i) + 16);
  if (!elev.init){ elev.y = elev.ty = stops[0]; elev.init = true; }
  if (Math.abs(elev.ty - elev.y) < 0.5){ elev.y = elev.ty; elev.wait -= dt; if (elev.wait <= 0){ elev.ty = pick(stops); elev.wait = rand(1.5,3.5); } }
  else elev.y += Math.sign(elev.ty - elev.y)*Math.min(Math.abs(elev.ty-elev.y), 40*dt);
  if (!stops.some(s => s === elev.ty)) elev.ty = stops[0];
  const shown = S.claims.slice(0,6);
  shown.forEach((c,k) => {
    let u = CUST.find(u => u.id === c.id && u.state !== "out");
    if (!u){ u = {id:c.id, x:34, state:"wait", face:1, moving:false, mood:null,
      look:(() => { const alt = Math.random() < 0.5, skirt = alt && Math.random() < 0.4 ? pick(["#2B2D52","#4A6FA5","#B23A3A","#3E9B4F"]) : null;
        return {skin:pick(SKINS), hair:pick(HAIRS), shirt:pick(CUST_SHIRTS), pants:skirt ? "#3A3048" : pick(["#2B2D52","#4A6FA5","#6B4A2B","#3A3F6B"]), skirt, style:alt ? pick([1,2,3,4,5,7]) : pick([0,0,4,1,6,8]), scarf:pick(["#3E2E6A","#B23A3A","#2BB3B1"]), beard:!alt && Math.random() < 0.25 ? "#3A2618" : null, earrings:alt && Math.random() < 0.4, hat:!alt && Math.random() < 0.5}; })()};
      CUST.push(u); }
    u.tx = 140 - k*15;
  });
  for (const u of CUST){
    if (u.state === "wait" && !S.claims.some(c => c.id === u.id)) u.state = "out";
    if (u.state === "wait" && !shown.some(c => c.id === u.id)) u.state = "out";
    const tx = u.state === "out" ? 30 : u.tx;
    const d = tx - u.x;
    if (Math.abs(d) > 0.5){ u.x += Math.sign(d)*Math.min(Math.abs(d), (u.state==="out"?26:20)*dt); u.face = Math.sign(d); u.moving = true; }
    else { u.moving = false; if (u.state === "wait") u.face = 1; }
  }

    toast(pick(["HR announced a mandatory fun day. Everyone is 25% slower for 30 seconds.","HR is running a trust-fall workshop. Productivity has fallen, and so has Kevin.","HR reorganised every team into “pods.” Nobody knows which pod they’re in. Everything slows down."]), "bad"); } }
  if (S.hrSlump > 0) S.hrSlump = Math.max(0, S.hrSlump - dt);
  if (capReq() > 0 && S.cash < capReq() && S.capWarnQ !== S.quarter){ S.capWarnQ = S.quarter; sfx("warn"); toast(`Your capital is below what the regulator requires (${fmt(capReq())}). Below 80% of that at an earnings call means a warning.`, "bad"); }
  if (S.rivalT != null){ S.rivalT -= dt; if (S.rivalT <= 0){ S.rivalT = null; rivalPoach(); if (modalOpen) return; } }
  if (S.outage > 0){ S.outage -= dt; if (S.outage <= 0){ S.outage = 0; toast("IT is back up. They turned it off and on again.", "good"); } }
  checkAch();

  S.qt += dt;
  if (S.qt >= Q_LEN){ S.qt = 0; earnings(); return; }
  checkRank();
  S.nextEvent -= dt;

}

function sparkline(){
  const h = S.hist.slice(-30); if (h.length < 2) h.unshift(h[0]);
  const mx = Math.max(...h), mn = Math.min(...h), span = Math.max(0.01, mx-mn);
  const pts = h.map((v,k) => `${(k/(h.length-1)*296+2).toFixed(1)},${(70 - (v-mn)/span*60).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 300 76" preserveAspectRatio="none" aria-label="Share price history">
    <polygon points="2,76 ${pts} 298,76" fill="rgba(255,210,63,.18)"/>
    <polyline points="${pts}" fill="none" stroke="#FFD23F" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function doBuyback(){ const c = buybackCost(); if (S.cash < c) return false; spend(c, "other"); discSpent += c; S.stock *= 1.04; checkRank(); return true; }

/* Earnings */
function earnings(){
  const q = S.q;
  const notes = [];
  q.cover = 0;
  for (const k of Object.keys(COVERS)) if (S.cover[k]){
    const c = coverCost(k, q.prem);
    if (S.cash >= c){ S.cash -= c; q.cover += c; }
    else { S.cover[k] = false; notes.push(`You couldn’t afford to renew ${COVERS[k].name.toLowerCase()}. It has lapsed.`); }
  }
  q.loan = 0;
  if (S.loan){
    const pay = Math.min(S.loan.per, S.loan.left);
    S.cash -= pay; S.loan.left -= pay; q.loan = Math.min(S.loan.interest, pay);
    if (S.loan.left <= 0){ S.loan = null; notes.push("Your bank loan is fully repaid."); }
  }
  q.inv = 0;
  if (lv("invest")){ const cap = invCapital(), st = INV[S.invRisk || 0]; q.inv = Math.round(cap*(st.mean + st.sd*gauss())); S.cash += q.inv; S.invLast = q.inv;
    if (q.inv < 0) notes.push(`Your ${st.name.toLowerCase()} investments lost ${fmt(-q.inv)} this quarter.`); }
  const profit = q.prem - q.paid - q.sal - q.other - q.cover - q.loan + q.inv;
  const hist = (S.profHist || []).slice(-3), g = growthRate();
  const avg = hist.length ? hist.reduce((a, b) => a + b, 0)/hist.length : 0;
  const expected = avg > 0 ? Math.max(40, avg*(1+g)) : 40;
  const basis = avg > 0 && avg*(1+g) > 40 ? `Your average profit over the last ${hist.length === 1 ? "quarter" : hist.length + " quarters"} (${fmt(avg)}), plus ${Math.round(g*100)}%.` : `Their minimum. They never accept less than ${fmt(40)}.`;
  const surprise = (profit - expected)/Math.max(Math.abs(expected), 40);
  const inLine = profit >= 0 && surprise < 0 && surprise >= -0.05;
  let ch = clamp(surprise*0.2, -0.25, 0.35); const ir = lv("ir");
  if (ch > 0) ch *= 1 + 0.15*ir; else ch *= Math.max(0.3, 1 - 0.12*ir);
  if (S.aiHype){ ch += 0.06; notes.push("You said “AI” forty times. Analysts added 6% out of reflex."); S.aiHype = false; }
  if (S.happy < 25){ ch -= 0.05; notes.push("A sustainability fund sold your stock over customer complaints. Share price down 5%."); }
  const gap = compGap();
  let strike = false;
  const gouged = priceIdx() === 3 && Math.random() < 0.35;
  const capShort = capReq() > 0 && S.cash < capReq()*0.8;
  if (!capShort && capReq() > 0 && S.cash < capReq()) notes.push(`Your capital is ${Math.round(capRatio()*100)}% of what the regulator requires. That’s within tolerance, but below 80% you’ll get a warning.`);
  if (gap > 0 || S.happy < 20 || gouged || capShort){
    strike = true; S.strikes++; S.cleanQ = 0; S.cleanRun = 0;
    const fine = Math.round(Math.max(100, Math.max(0, S.cash)*0.1)*(perk("lobbyist") ? 0.6 : 1)*prDamp()); S.cash -= fine;
    notes.push(`Regulator warning ${S.strikes} of ${maxStrikes()}: ${gap > 0 ? `Compliance only covers ${compHave()} of the ${compNeed()} floors it needs to` : capShort ? `you hold ${fmt(Math.max(0, S.cash))} but must hold ${fmt(capReq())} in capital` : S.happy < 20 ? "customers are miserable" : "your prices failed the fair-value test"}. Fine: ${fmt(fine)}.${S.strikes >= maxStrikes() ? "" : " Two clean quarters remove a warning."}`);
  } else {
    S.cleanQ++; S.cleanRun = (S.cleanRun || 0) + 1;
    if (S.strikes > 0 && S.cleanQ >= 2){ S.strikes--; S.cleanQ = 0; notes.push("The regulator removed one of your warnings. Keep it clean."); }
  }
  const old = S.stock; S.stock = Math.max(0.5, S.stock*(1+ch));
  S.hist.push(S.stock); if (S.hist.length > 40) S.hist.shift();
  const qn = S.quarter; S.quarter++; S.lastProfit = profit; S.q = blankQ();
  S.profHist = (S.profHist || []).concat([profit]).slice(-3);
  S.streak = profit >= expected ? (S.streak || 0) + 1 : inLine ? (S.streak || 0) : 0;
  S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
  S.bestProfit = Math.max(S.bestProfit || 0, profit);
  const stars = (profit < 0 || surprise < 0) ? 0 : surprise >= 0.6 ? 3 : surprise >= 0.25 ? 2 : 1;
  const bonus = stars ? Math.round(B()*0.35*stars/10)*10 : 0;
  if (bonus) S.cash += bonus;
  S.stars += stars; S.favour += stars; if (stars === 3) S.best3 = true;
  let dc = stars ? 5 + 3*stars + Math.min(S.streak, 5) : profit < 0 ? -20 : inLine ? 2 : -Math.round(4 + 12*Math.min(1, -surprise));
  if (S.happy < 25) dc -= 6;
  if (strike) dc -= 10;
  if (dc < 0) dc = Math.round(dc*prDamp());
  S.conf = clamp(S.conf + dc, 0, 100);
  const oldDiff = S.diff;
  { let dd = 0.02 + (stars ? 0.05 + 0.04*stars : -0.1); if (dd > 0 && S.diff > 3) dd /= (S.diff - 2); S.diff = Math.max(1, 1 + 0.035*qn, S.diff + dd); }
  if (qn >= 9 && S.rivalT == null && Math.random() < Math.min(0.6, 0.15 + 0.08*Math.max(0, S.diff - 2) + 0.01*Math.max(0, workFloors() - 10))) S.rivalT = rand(10, 50);
  if (S.idleMode && qn > 4 && Math.random() < 0.22*Math.min(1, (qn - 4)/8)){
    const bl = pick(BLUNDERS), cost = Math.round(Math.max(150, Math.abs(profit)*bl.k)/10)*10;
    S.cash -= cost; if (bl.conf) S.conf = clamp(S.conf - bl.conf, 0, 100); if (bl.mood) mood(-bl.mood);
    notes.push(`Board blunder: ${bl.text} It cost ${fmt(cost)}.`);
  }
  if (lv("pr") && S.prLeakAt == null && Math.random() < Math.min(0.3, 0.05*lv("pr"))) S.prLeakAt = rand(8, 50);
  if (lv("hr") && S.hrAt == null && Math.random() < Math.min(0.4, 0.08*lv("hr"))) S.hrAt = rand(8, 50);
  if (lv("it") > 0 && S.outageAt == null && Math.random() < Math.min(0.4, 0.06*lv("it"))) S.outageAt = rand(8, 50);
  const sinceSwan = qn - (S.lastSwanQ || 1);
  if (qn >= 4 && !S.swan && sinceSwan >= 3 && (sinceSwan >= 10 || Math.random() < Math.min(0.6, (0.03*sinceSwan + 0.005*(S.diff - 1))*(S.idleMode ? 1.3 : 1)))){
    S.lastSwanQ = qn;
    S.swan = {t:rand(12, 48), kind:pickSwan()};
  }
  if (qn % 8 === 0) notes.push("New regulations: a 400-page rulebook just landed. Compliance must now cover one more floor than before.");
  { const resLv = lvSpec("actuary", "reserving");
    if (resLv && Math.random() < Math.min(0.4, 0.08*resLv)){ const rel = Math.round(baseIncome()*Q_LEN*0.05); S.cash += rel;
      notes.push(`Your reserving actuaries set aside a little too much for old claims. ${fmt(rel)} has been released back into profit, and they are being insufferable about it.`); } }
  if (qn === 5) notes.push("Coming next quarter: capital rules. The regulator will require you to hold cash in proportion to the premiums you write. Catastrophe reinsurance and Capital Modelling actuaries reduce how much.");
  const qLabel = `Q${((qn-1)%4)+1}, year ${Math.ceil(qn/4)}`;
  let lede, quote;

/* ---------- Score ---------- */
function daysSurvived(){ return Math.floor((S.quarter - 1)*91 + S.qt/Q_LEN*91); }
function avgRep(){ return S.repT > 0 ? S.repSum/S.repT : S.happy; }
function scoreParts(){
  const money = Math.round(Math.sqrt(Math.max(0, S.earned || 0))*8);
  const days = daysSurvived()*4;
  const achN = ACH.filter(a => S.ach[a.id]).length;
  const bonus = (S.stars || 0)*40 + achN*150 + S.rankIdx*400 + (S.exit ? Math.round(Math.sqrt(S.exit.value)*15) : 0);
  const rep = avgRep(), mult = 0.5 + rep/100;
  return {money, days, bonus, achN, rep, mult, total:Math.round((money + days + bonus)*mult)};
}
function grade(t){ return t >= 25000 ? "S" : t >= 15000 ? "A" : t >= 8000 ? "B" : t >= 4000 ? "C" : "D"; }

let tutorialOn = false, tutI = 0;
function tutTarget(st){ if (!st.el) return null; const el = typeof st.el === "function" ? st.el() : $(st.el); return el && el.getClientRects().length ? el : null; }
function startTutorial(){ tutorialOn = true; tutI = 0; $("#coach").hidden = false; showStep(); }
function endTutorial(){
  tutorialOn = false; $("#coach").hidden = true;
  if (!S.seen){ S.seen = true; save(); setTimeout(() => openBoard(false, true), 250); }
  toast("You can reopen the tutorial any time with the ? button at the top.", "good");
}
function showStep(){
  const st = TUT[tutI], last = tutI === TUT.length - 1, first = tutI === 0;
  $("#coachCard").innerHTML = `<div class="coach-dots" aria-hidden="true">${TUT.map((_, k) => `<i class="${k <= tutI ? "on" : ""}"></i>`).join("")}</div>
    <p class="coach-step">${first ? "Tutorial" : `Step ${tutI} of ${TUT.length - 1}`}</p>
    <h3>${st.title}</h3><p>${st.text}</p>
    <div class="coach-btns">${last ? "" : `<button class="btn ghost" data-tut="skip">Skip tutorial</button>`}<span style="flex:1"></span>${first ? "" : `<button class="btn ghost" data-tut="back">Back</button>`}<button class="btn" data-tut="next">${first ? "Start the tour" : last ? "Start playing" : "Next"}</button></div>`;
  placeCoach();
  $("#coachCard").querySelector('[data-tut="next"]').focus({preventScroll:true});
}
function placeCoach(){
  if (!tutorialOn) return;
  const el = tutTarget(TUT[tutI]), card = $("#coachCard"), hole = $("#coachHole");
  const W = window.innerWidth, H = window.innerHeight, cw = Math.min(360, W - 24);
  card.style.width = cw + "px";
  const ch = card.offsetHeight;
  if (!el){
    hole.style.cssText = `left:${W/2}px;top:${H/2}px;width:0;height:0;border-width:0`;
    card.style.left = (W - cw)/2 + "px"; card.style.top = Math.max(12, (H - ch)/2) + "px";
    return;
  }
  const r = el.getBoundingClientRect(), pad = 6;
  hole.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px`;
  let top;
  if (r.bottom + pad + 12 + ch < H - 8) top = r.bottom + pad + 12;
  else if (r.top - pad - 12 - ch > 8) top = r.top - pad - 12 - ch;
  else top = Math.max(12, (H - ch)/2);
  card.style.top = top + "px";
  card.style.left = clamp(r.left + r.width/2 - cw/2, 12, W - cw - 12) + "px";
}
function tutNext(){ if (tutI >= TUT.length - 1) endTutorial(); else { tutI++; showStep(); } }
$("#coach").addEventListener("click", e => {
  const b = e.target.closest("[data-tut]"); if (!b) return;

  if (!runs.length) return `<div class="empty"><p>No finished runs yet. Your first one will appear here.</p></div>`;
  return `<table class="lb"><tr><th>#</th><th>Syndicate</th><th>Score</th><th>Grade</th><th>Qtrs</th></tr>${runs.map((r, k) => `<tr class="${r.id === hl ? "me" : ""}"><td>${k + 1}</td><td>${esc(r.name)}<small>${esc(r.title)}</small>${r.ceo ? `<small style="display:block;color:var(--ink-dim)">led by ${esc(r.ceo)}</small>` : ""}</td><td>${r.score.toLocaleString("en-GB")}</td><td>${r.grade}</td><td>${r.quarters}</td></tr>`).join("")}</table>`;
}
function openLeaderboard(tab, city){
  tab = tab === "global" && onlineOk() ? "global" : (tab || (onlineOk() ? "global" : "local")); city = city || "all";
  const tabs = onlineOk() ? `<div class="seg two">${[["global","🌍 Global"],["local","📱 This device"]].map(([k, l]) => `<button class="btn" data-act="lb:${k}" aria-pressed="${tab === k}">${l}</button>`).join("")}</div>` : "";
  const cities = tab === "global" ? `<div class="seg four" style="margin-top:6px">${[["all","All"],["london","London"],["nyc","New York"],["bermuda","Bermuda"]].map(([k, l]) => `<button class="btn" data-act="lb:global:${k}" aria-pressed="${city === k}">${l}</button>`).join("")}</div>` : "";
  openModal(`<div class="top"><h2>Leaderboard</h2>${xBtn}</div>${tabs}${cities}
    ${tab === "global" ? `<div id="lbGlobal"><p class="dim">Loading the global leaderboard…</p></div><p class="dim">Company and CEO names on the global leaderboard are public. Idle mode runs aren’t included.</p>` : `<p class="dim">Your 10 best runs on this device.</p>${lbTable()}`}`, {view:"lb" + tab + city});
  if (tab === "global"){ const want = "lb" + tab + city;
    fetchGlobal(city).then(rows => { if (view !== want) return; const el = $("#lbGlobal"); if (el) el.innerHTML = globalTable(rows); })
      .catch(() => { if (view !== want) return; const el = $("#lbGlobal"); if (el) el.innerHTML = `<p class="note">Couldn’t reach the global leaderboard right now. Check your connection, or look at your runs on this device.</p>`; }); }
}

/* ---------- global leaderboard (Supabase) ---------- */
const PENDING_KEY = "fineprint-pending-scores";
function onlineOk(){ return !!(typeof ONLINE !== "undefined" && ONLINE.enabled && ONLINE.url && ONLINE.key && typeof fetch === "function"); }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }
function runPayload(sp){
  return {runId:S.globalId, name:companyName(), ceo:ceoName(), city:cityId(), quarters:Math.max(1, S.quarter - 1), days:daysSurvived(),
    earned:Math.round(S.earned || 0), stars:S.stars || 0, achievements:sp.achN, rankIdx:S.rankIdx, avgMood:Math.round(sp.rep),
    exitBonus:S.exit ? Math.round(Math.sqrt(S.exit.value)*15) : 0, version:VERSION};
}
async function postScore(p){
  const r = await withTimeout(fetch(`${ONLINE.url}/functions/v1/submit-score`, {method:"POST", headers:{"content-type":"application/json", apikey:ONLINE.key}, body:JSON.stringify(p)}), 9000);
  if (!r.ok){ const err = new Error((await r.text().catch(() => "")) || String(r.status)); err.status = r.status; throw err; }
  return r.json();
}
function loadPending(){ try { return JSON.parse(localStorage.getItem(PENDING_KEY)) || []; } catch(e){ return []; } }
function savePending(list){ try { localStorage.setItem(PENDING_KEY, JSON.stringify(list.slice(-5))); } catch(e){} }
async function flushPending(){
  if (!onlineOk()) return; const list = loadPending(); if (!list.length) return; const keep = [];
  for (const p of list){ try { await postScore(p); } catch(e){ if (!e.status || e.status >= 500 || e.status === 429) keep.push(p); } }
  savePending(keep);
}
async function submitGlobal(sp){
  if (!onlineOk()) return {skipped:"off"};
  if (S.idleMode || S.idleTainted) return {skipped:"idle"};
  if (S.globalSent) return {skipped:"sent"};
  const p = runPayload(sp);
  try { const res = await postScore(p); S.globalSent = true; save(); return res; }
  catch(e){ if (!e.status || e.status >= 500 || e.status === 429){ queuePending(p); return {queued:true}; } if (/already submitted/.test(e.message)){ S.globalSent = true; save(); return {skipped:"sent"}; } return {error:e.message}; }
}
function queuePending(p){ const list = loadPending().filter(x => x.runId !== p.runId); list.push(p); savePending(list); }
async function fetchGlobal(city){
  const q = `${ONLINE.url}/rest/v1/scores?select=name,ceo,city,score,quarters,rank_idx,created_at&order=score.desc&limit=20${city && city !== "all" ? `&city=eq.${encodeURIComponent(city)}` : ""}`;
  const r = await withTimeout(fetch(q, {headers:{apikey:ONLINE.key}}), 9000);
  if (!r.ok) throw new Error(String(r.status));
  return r.json();
}
function globalTable(rows){
  if (!rows || !rows.length) return `<div class="empty"><p>No scores here yet. Finish a run to claim the top spot.</p></div>`;
  const flag = {london:"🇬🇧", nyc:"🇺🇸", bermuda:"🇧🇲"}, mine = companyName();
  return `<table class="lb"><tr><th>#</th><th>Syndicate</th><th>Score</th><th>Qtrs</th></tr>${rows.map((r, k) => `<tr class="${r.name === mine && r.ceo === ceoName() ? "me" : ""}"><td>${k + 1}</td><td>${flag[r.city] || ""} ${esc(r.name)}<small>${RANKS[clamp(r.rank_idx || 0, 0, RANKS.length - 1)].name}${r.ceo ? `, led by ${esc(r.ceo)}` : ""}</small></td><td>${Number(r.score).toLocaleString("en-GB")}</td><td>${r.quarters}</td></tr>`).join("")}</table>`;
}

/* game/endings.js - part of Fine Print Syndicate. Bundled into one HTML file by build.js. */
function gameOver(reason){
  reason = reason || "bankrupt";
  if (perk("parachute") && reason !== "exit" && reason !== "retire"){
    delete S.perks.parachute;
    S.cash = Math.max(S.cash, 0); S.conf = Math.max(S.conf, 35); S.strikes = Math.min(S.strikes, maxStrikes() - 1);
    fxConfetti(); save();
    openModal(`<h2>Golden parachute deployed</h2><p>You were about to be ${reason === "bankrupt" ? "bankrupt" : reason === "fired" ? "fired" : "shut down"}, but your golden parachute saved you. Cash, confidence and warnings have been patched up, just this once.</p>
      <div class="closeRow"><button class="btn" data-act="close">Never again</button></div>`, {locked:true});
    return;
  }
  if (!S.overCut && scene && !window.__bot && CAREER_CUTS[reason]){
    S.overCut = true; S.over = true; save(); if (modalOpen){ modalLocked = false; closeModal(); }
    const cc = CAREER_CUTS[reason]; playCutscene(typeof cc.kind === "function" ? cc.kind() : cc.kind, () => gameOver(reason), Object.assign({}, cc.opts(), {}));
    return;
  }
  const e = ENDINGS[reason]; if (reason !== "exit") sfx("lose");
  const spR = scoreParts(); let run = S.runId ? loadRuns().find(r => r.id === S.runId) : null;
  if (!run && !S.idleMode && !S.idleTainted){ run = recordRun(spR, reason); S.runId = run.id; }
  const sp = scoreParts(), prevBest = bestScore(), isNew = !S.idleMode && sp.total > prevBest;
  if (isNew) saveBest(sp.total);
  S.over = true; save();
  openModal(`<h2>${e.title}</h2>
    <p>${e.text}</p>
    ${scoreHtml(sp, Math.max(prevBest, sp.total), isNew)}
    <div class="facts">
      <div class="fact"><span>Quarters survived</span><b>${S.quarter-1}</b></div>
      <div class="fact"><span>CEO</span><b style="font-size:15px">${ceoN()}</b></div>
      <div class="fact"><span>Best title</span><b style="font-size:15px">${RANKS[S.rankIdx].name}</b></div>
      <div class="fact"><span>Stars earned</span><b>${S.stars} ★</b></div>
      <div class="fact"><span>Achievements</span><b>${ACH.filter(a => S.ach[a.id]).length} of ${ACH.length}</b></div>
    </div>
    ${S.idleMode || S.idleTainted || !run ? `<p class="note">This run used idle mode, so the board made some of the decisions and the score isn’t recorded.</p>` : `<h3>Leaderboard</h3>
    ${onlineOk() ? `<p class="dim" id="globalStatus">Sending your score to the global leaderboard…</p>` : ""}
    <div class="lbname"><input id="lbName" maxlength="24" placeholder="Name your syndicate" value="${esc(run.name)}" aria-label="Your name on the leaderboard"><button class="btn ghost" data-act="lbname:${run.id}">Save name</button></div>
    <div id="lbArea">${lbTable(run.id)}</div>`}
    ${onlineOk() && run ? `<div class="closeRow" style="justify-content:flex-start"><button class="btn ghost" data-act="lb:global">🌍 Global leaderboard</button></div>` : ""}
    <button class="btn" style="width:100%;margin-top:12px" data-act="restart-yes">Start a new company</button>`, {locked:true});
  if (run && onlineOk()) submitGlobal(sp).then(res => { const el = $("#globalStatus"); if (!el) return;
    el.textContent = res.score != null ? `Your score is on the global leaderboard as ${companyName()}, led by ${ceoName()}. Names there are public.`
      : res.queued ? "Couldn’t reach the global leaderboard. Your score will be sent next time you play online."
      : res.skipped === "sent" ? "This run is already on the global leaderboard."
      : res.error ? `The global leaderboard didn’t accept this run (${res.error}).` : ""; });
}
function coverCost(k, prem){ return Math.round(Math.max(60, prem*COVERS[k].rate)*(perk("reinsdisc") ? 0.75 : 1)*(1 - Math.min(0.25, 0.05*lvSpec("actuary", "capital")))); }
function blackSwan(kind){ if (!SWANS[kind]) kind = pickSwan(); S.swanDone = true; S.cyc = Math.PI/2; playCutscene(kind, () => swanResolve(kind)); }
function swanResolve(kind){
  const sw = SWANS[kind];
  let body;
  if (!sw.cover){
    const drop = 0.3*Math.max(0.4, 1 - 0.1*lv("ir"));
    S.stock = Math.max(0.5, S.stock*(1 - drop)); S.conf = clamp(S.conf - Math.round(10*prDamp()), 0, 100);
    const il = lv("invest") ? Math.round(invCapital()*INV[S.invRisk || 0].crash) : 0; if (il){ S.cash -= il; S.q.other += il; }
    body = `<p>Your share price fell ${Math.round(drop*100)}%. ${lv("ir") ? "Capital Relations softened the blow." : "Capital Relations could have softened the blow."} Board confidence fell.${il ? ` Your ${INV[S.invRisk || 0].name.toLowerCase()} investments lost ${fmt(il)}.` : ""}</p>`;
  } else {
    const gross = Math.round(Math.max(2000, baseIncome()*Q_LEN*rand(2.2, 3.4)*(1 + 0.03*Math.max(0, workFloors() - 10))*(1 + 0.1*Math.max(0, S.diff - 2))*swanExposure(kind)));
    const mit = sw.mit(), afterMit = Math.round(gross*(1 - mit)), riskCut = Math.min(0.2, 0.04*lv("risk")), net = Math.round(afterMit*(1 - riskCut));
    const covered = S.cover[sw.cover];
    const loss = covered ? Math.round(net*0.1) : net;
    spend(loss, "other");
    if (covered){ S.swansSurvived = (S.swansSurvived || 0) + 1; S.conf = clamp(S.conf - 3, 0, 100); } S.swanKinds = Object.assign(S.swanKinds || {}, {[kind]: true}); if (!covered) S.swanNaked = (S.swanNaked || 0) + 1;
    else S.conf = clamp(S.conf - Math.round(25*prDamp()), 0, 100);
    body = `<table class="ledger">
      <tr><td>Total loss</td><td class="neg">−${fmt(gross)}</td></tr>
      ${mit ? `<tr><td>Saved by ${sw.mitName}</td><td class="pos">+${fmt(gross - afterMit)}</td></tr>` : ""}
      ${riskCut ? `<tr><td>Saved by your Risk Dept</td><td class="pos">+${fmt(afterMit - net)}</td></tr>` : ""}
      ${(() => { const ex = swanExposure(kind), cul = swanCulprit(kind); const cr = cityRisk(kind); return cul && Math.abs(ex - 1) > 0.15 ? `<tr><td colspan="2" class="dim">${ex > 1 ? `Your ${LINES[cul].name} book took the worst of it${cr > 1.15 ? `, and being in ${cityName()} didn’t help` : ""}, so this hit you ${ex.toFixed(1)}× harder than an average insurer.` : `Not much of what you insure was in the way${cr < 0.85 ? `, and ${cityName()} was spared the worst` : ""}: you took ${ex.toFixed(1)}× the usual hit.`}</td></tr>` : ""; })()}
      ${covered ? `<tr><td>Paid by your ${COVERS[sw.cover].name.toLowerCase()}</td><td class="pos">+${fmt(net - loss)}</td></tr>` : ""}
      <tr class="total"><td>You pay</td><td class="neg">−${fmt(loss)}</td></tr></table>
      <p>${covered ? "Your cover held. You paid only the 10% retention." : `You had no ${COVERS[sw.cover].name.toLowerCase()}, so you paid the lot. Board confidence −25.`}</p>
      ${S.cash < -overdraft() ? `<p class="note">This loss is bigger than the bank will tolerate.</p>` : ""}`;
  }
  openModal(`<div class="swan"><h2>🦢 Black swan: ${sw.title}</h2><p>${sw.text}</p>${body}</div>
    <div class="closeRow"><button class="btn red" data-act="close">Brace</button></div>`, {locked:true, auto:true, onClose:() => {
      if (S.cash < -overdraft()) return gameOver("bankrupt");
      if (S.conf <= 0) return gameOver("fired");
      save(); }});
}

/* Cutscenes for the ways a run can end. */
const CAREER_CUTS = {
  fired:{kind:"fired", opts:() => ({title:`${ceoName()} has been fired`, tag:"FIRED"})},
  bankrupt:{kind:"bankrupt", opts:() => ({title:`${companyName()} is bankrupt`, tag:"BANKRUPT"})},
  licence:{kind:"licence", opts:() => ({title:"The regulator has had enough", tag:"LICENCE REVOKED"})},
  retire:{kind:"retire", opts:() => ({title:`${ceoName()} steps down`, tag:"STEPPING DOWN", tagColor:0xC9A54A, tagText:"#1F2238", ceo:true,
    line:pick(["I’m stepping down to spend more time with my family. They’ve asked me to reconsider.", "I leave the company in safe hands. Mostly Percy’s.", "Thank you for the clock. I’ll treasure the time it tells."])})},
  exit:{kind:() => S.exit && S.exit.kind === "pe" ? "pe" : "ipo", opts:() => S.exit && S.exit.kind === "pe"
    ? {title:`${companyName()} sold to private equity`, tag:"SOLD", tagColor:0x2E7D4F}
    : {title:`${companyName()} goes public`, tag:"IPO", tagColor:0x2E7D4F, ceo:true, line:"Ding ding! I’m now a very liquid individual."}},
};

/* ---------- selling the company, and the golden ticket it earns ---------- */
const LEGACY_KEY = "fineprint-legacy";
function loadLegacy(){ try { return JSON.parse(localStorage.getItem(LEGACY_KEY)) || {tickets:0, seed:0, stars:0}; } catch(e){ return {tickets:0, seed:0, stars:0}; } }
function saveLegacy(l){ try { localStorage.setItem(LEGACY_KEY, JSON.stringify(l)); } catch(e){} }
const EXIT_REQ = {pe:{cash:1000000, stock:150}, ipo:{cash:2500000, stock:250, conf:70}};
function exitUnlocked(){ return S.rankIdx >= 3 && S.quarter >= 8; }
function exitReady(kind){ const r = EXIT_REQ[kind]; return exitUnlocked() && S.cash >= r.cash && S.stock >= r.stock && (!r.conf || S.conf >= r.conf); }
function exitValue(){
  const h = (S.profHist || []).slice(-4), q = h.length ? h.reduce((a, b) => a + b, 0)/h.length : 0;
  const base = Math.max(0, q)*16 + Math.max(0, S.cash)*0.5 + S.floors.reduce((a, f) => a + f.level, 0)*600;
  return Math.round(base*Math.sqrt(Math.max(1, S.stock)/10)*(1 + Math.min(0.4, 0.02*S.favour)));
}
function ticketFor(value){ return {seed:Math.min(50000, Math.round(value*0.03)), stars:3}; }
function sellCompany(kind){
  if (!exitReady(kind)) return;
  const v = exitValue(), mult = kind === "ipo" ? rand(0.8, 1.6) : 1, value = Math.round(v*mult);
  S.exit = {kind, value, mult}; S.exitKind = kind;
  const leg = loadLegacy(), tk = ticketFor(value);
  leg.tickets = Math.min(4, (leg.tickets || 0) + 1); leg.seed = tk.seed; leg.stars = tk.stars; leg.lastValue = value; saveLegacy(leg);
  checkAch(); save(); closeModal(); gameOver("exit");
}

/* Stepping down: end the run on your own terms and record the score as it stands. */
const STEP_DOWN_Q = 4;
function canStepDown(){ return S.quarter >= STEP_DOWN_Q && !S.over; }
function stepDown(){ if (!canStepDown()) return; S.retired = true; checkAch(); save(); closeModal(); gameOver("retire"); }

/* ui/cutscene-player.js - part of Fine Print Syndicate. Bundled into one HTML file by build.js. */
let cutsceneOn = false;
function playCutscene(kind, done, opts){
  opts = opts || {};
  if (!scene){ done(); return; }
  cutsceneOn = true;
  const sc = scene, cam = sc.cameras.main, W = LW + 2*padX, H = viewH(), parts = [], timers = [];
  const add = o => { o.setScrollFactor(0).setDepth(200); parts.push(o); return o; };
  const txt = (x, y, str, size, color, extra) => add(sc.add.text(x, y, str, Object.assign({fontFamily:FONT, fontSize:pxL(size)+"px", fontStyle:"700", color, align:"center", resolution:Math.ceil(cz)}, extra || {})).setOrigin(0.5));
  const sw = Object.assign({}, SWANS[kind] || {}, opts.title ? {title:opts.title} : {}), L = opts.line ? {name:opts.name || ceoName(), line:opts.line} : (CUT.LINES[kind] || {name:"", line:""});
  const mk = (key, w, h) => { if (!sc.textures.exists(key)){ const tx = sc.textures.createCanvas(key, w, h); tx.setFilter(Phaser.Textures.FilterMode.NEAREST); } return sc.textures.get(key); };
  const ftex = mk("cs_frame", CUT.SW, CUT.SH), ptex = mk("cs_face", 48, 48);
  const DUR = 5600, t0 = performance.now();
  const paintAll = () => { const tt = Math.min(1, (performance.now() - t0)/DUR); CUT.drawScene(ftex.getContext(), kind, tt); ftex.refresh(); if (opts.ceo) CUT.drawCEO(ptex.getContext(), S.ceo || {}, 0.3 + tt*0.6); else CUT.drawPortrait(ptex.getContext(), kind, tt); ptex.refresh(); };
  paintAll();
  const k = Math.max(1, Math.min(W*0.96, (H*0.6)*CUT.SW/CUT.SH)/(pxL(360)));
  const bannerH = pxL(56)*Math.min(k, 1.6), gapY = pxL(8), dialogH = Math.max(pxL(100)*Math.min(k, 1.8), 30);
  let fw = W*0.96, fh = fw*CUT.SH/CUT.SW;
  const maxH = H - bannerH - dialogH - gapY*3 - pxL(26);
  if (fh > maxH){ fh = maxH; fw = fh*CUT.SW/CUT.SH; }
  const ts = Math.min(k, 1.8);
  const fx = (W - fw)/2, fy = bannerH + gapY;
  add(sc.add.rectangle(0, 0, W, H, 0x0E1222, 0.95).setOrigin(0));
  add(sc.add.rectangle(0, 0, W, bannerH, 0x1F2A44, 1).setOrigin(0));
  add(sc.add.rectangle(0, bannerH - pxL(3), W, pxL(3), 0xC9A54A, 1).setOrigin(0));
  const tagW = pxL(84)*Math.min(k, 1.6), tagH = bannerH*0.32;
  const tagLabel = opts.tag || "BREAKING", tagW2 = Math.max(tagW, pxL(8*tagLabel.length + 16)*Math.min(k, 1.6));
  add(sc.add.rectangle(W/2 - tagW2/2, bannerH*0.12, tagW2, tagH, opts.tagColor || 0xB23A3A, 1).setOrigin(0));
  txt(W/2, bannerH*0.12 + tagH/2, tagLabel, 11*Math.min(k, 1.6), opts.tagText || "#FFF6E2");
  txt(W/2, bannerH*0.7, sw.title, 15*Math.min(k, 1.6), "#E3C064", {wordWrap:{width:W*0.94}});
  const frame = add(sc.add.image(fx, fy, "cs_frame").setOrigin(0).setDisplaySize(fw, fh));
  add(sc.add.rectangle(fx, fy, fw, fh).setOrigin(0).setStrokeStyle(pxL(3), 0xC9A54A));
  const dw = Math.min(fw, W*0.96), dx = (W - dw)/2, dy = fy + fh + gapY, ps = dialogH - pxL(14);
  add(sc.add.rectangle(dx, dy, dw, dialogH, 0xF7F2E6, 1).setOrigin(0).setStrokeStyle(pxL(3), 0x1F2A44)); add(sc.add.rectangle(dx + pxL(3), dy + pxL(3), dw - pxL(6), dialogH - pxL(6)).setOrigin(0).setStrokeStyle(pxL(1.5), 0xC9A54A));
  add(sc.add.rectangle(dx + pxL(6), dy + pxL(6), ps + pxL(2), ps + pxL(2), 0x1F2A44, 1).setOrigin(0)); add(sc.add.image(dx + pxL(7), dy + pxL(7), "cs_face").setOrigin(0).setDisplaySize(ps, ps));
  const tx0 = dx + ps + pxL(16), twid = dw - ps - pxL(26);
  add(sc.add.text(tx0, dy + pxL(8)*ts, L.name, {fontFamily:FONT, fontSize:pxL(14*ts)+"px", fontStyle:"700", color:"#23305A", resolution:Math.ceil(cz)}));
  const lineT = add(sc.add.text(tx0, dy + pxL(30)*ts, "", {fontFamily:FONT, fontSize:pxL(13*ts)+"px", color:"#1B2238", wordWrap:{width:twid}, lineSpacing:pxL(2)*ts, resolution:Math.ceil(cz)}));
  const skip = txt(W/2, Math.min(H - pxL(14), dy + dialogH + pxL(16)), "Tap to skip", 11, "#E9E2CF"); skip.setAlpha(.8);
  frame.setScale(frame.scaleX*0.92, frame.scaleY*0.92).setAlpha(0);
  sc.tweens.add({targets:frame, scaleX:fw/CUT.SW, scaleY:fh/CUT.SH, alpha:1, duration:260, ease:"Back.easeOut"});
  sfx("swan"); cam.shake(500, 0.006);
  let finished = false, lastBolt = 0;
  const end = () => { if (finished) return; finished = true; cutsceneOn = false; timers.forEach(t => t.remove(false)); parts.forEach(o => { sc.tweens.killTweensOf(o); o.destroy(); }); sc.input.off("pointerdown", onTap); done(); };
  timers.push(sc.time.addEvent({delay:70, loop:true, callback:() => {
    const el = performance.now() - t0; paintAll();
    const n = Math.min(L.line.length, Math.floor((el - 450)/30)); if (n > 0 && lineT.text.length !== n){ lineT.setText(L.line.slice(0, n)); if (n % 3 === 0) sfx("tick"); }
    if ((kind === "hurricane" || kind === "ash" || kind === "solar") && el - lastBolt > 700 && Math.random() < 0.08){ lastBolt = el; cam.shake(180, 0.004); }
    if (el > DUR + 700) end();
  }}));
  const onTap = () => { if (performance.now() - t0 > 600) end(); };
  sc.input.on("pointerdown", onTap);
}

/* game/progression.js - part of Fine Print Syndicate. Bundled into one HTML file by build.js. */
function checkAch(){
  const got = [];
  for (const a of ACH){ if (!S.ach[a.id]){ let ok = false; try { ok = a.test(); } catch(e){} if (ok){ S.ach[a.id] = true; S.favour++; got.push(a.name); } } }
  if (!got.length) return;
  if (got.length <= 2) got.forEach(n => toast(`Achievement: ${n}! +1 ★ to spend in the Boardroom.`, "good"));
  else toast(`${got.length} achievements unlocked: ${got.slice(0, 3).join(", ")}${got.length > 3 ? " and more" : ""}. +${got.length} ★ to spend in the Boardroom.`, "good");
  fxConfetti();
}
function compHtml(){
  const need = compNeed(), have = compHave(), gap = need - have;
