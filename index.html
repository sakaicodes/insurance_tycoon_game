<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fine Print Syndicate (Phaser)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&text=0123456789&display=swap" rel="stylesheet">
<style>
:root{
  --page:#9FB0C2; --panel:#24264F; --panel-2:#30336A; --edge:#12133A; --line:#3B3E7A;
  --ink:#FFFFFF; --ink-dim:#D0D3F7; --gold:#FFD23F; --money:#4BE39A; --danger:#FF6B6B; --pink:#FF8FB1;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page:#0E1030; color-scheme:dark; } }
:root[data-theme="dark"]{ --page:#0E1030; color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--page);color:var(--ink);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);box-shadow:0 0 0 3px var(--edge)}
.px{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif}

/* HUD */
.hud{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:6px;padding:8px 8px 6px;background:var(--panel);border-bottom:3px solid var(--edge);font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif}
.stat{background:var(--panel-2);border:2px solid var(--edge);border-radius:6px;padding:5px 8px;min-width:0;box-shadow:inset 0 2px 0 rgba(255,255,255,.07)}
.stat .k{display:block;font-size:13px;color:var(--ink-dim);letter-spacing:.01em}
.stat b{font-variant-numeric:tabular-nums lining-nums;display:block;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.stat small{display:block;font-size:13px;color:var(--ink-dim);line-height:1.25}
.cash b{color:var(--money)} .cash.neg b{color:var(--danger)}
.stock b{color:var(--gold)}
.bar{height:10px;background:var(--edge);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;width:50%;background:var(--pink);transition:width .4s}
.qrow{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim);padding:2px 2px 0}
.qbar{flex:1;height:8px;background:var(--edge);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--gold)}

/* Tower */
#towerWrap{flex:1;position:relative;overflow:hidden;background:#9FB0C2;touch-action:none;min-height:0}
#game{position:absolute;inset:0}
#game canvas{display:block;touch-action:none}
#towerInner{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end}
#stage{position:relative}
canvas{display:block;width:100%;cursor:pointer;image-rendering:pixelated;touch-action:manipulation}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-100%);font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-weight:700;font-size:16px;color:var(--money);white-space:nowrap;
  text-shadow:0 2px 0 var(--edge),2px 0 0 var(--edge),-2px 0 0 var(--edge),0 -2px 0 var(--edge);animation:rise 1.4s ease-out forwards}
.pop.bad{color:var(--danger)}
.pop.stamp{color:#fff;background:var(--danger);padding:0 6px;border:2px solid var(--edge);text-shadow:none;rotate:-8deg;font-size:14px}
.pop.stamp.ok{background:#2FB879}
@keyframes rise{from{opacity:1;transform:translate(-50%,-100%)}to{opacity:0;transform:translate(-50%,-280%)}}

/* Dock */
.dock{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:8px 8px 10px;background:var(--panel);border-top:3px solid var(--edge)}
.btn{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-weight:600;font-size:17px;line-height:1.1;color:#2A1E00;background:var(--gold);border:3px solid var(--edge);border-radius:7px;padding:10px 12px;box-shadow:0 4px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15),inset 0 2px 0 rgba(255,255,255,.45);cursor:pointer;position:relative;transition:transform .06s,box-shadow .06s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--edge),inset 0 -3px 0 rgba(0,0,0,.15)}
.btn:disabled{filter:grayscale(.85) brightness(.75);cursor:not-allowed}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.btn.green{background:#4BE39A}
.btn.red{background:#FF7A7A}
.btn.ghost{background:#C9CCF5}
.btn.blue{background:#7FD3F7}
.btn small{display:block;font-size:13px;font-weight:400;opacity:.85;margin-top:2px}
.badge{display:inline-block;min-width:22px;padding:1px 6px;margin-left:4px;border-radius:999px;background:var(--edge);color:#fff;font-size:14px}
.btn.hot .badge{background:var(--danger);animation:thump 1s steps(2) infinite}
@keyframes thump{50%{transform:scale(1.15)}}

/* Toasts */
#toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 124px);transform:translateX(-50%);width:min(520px,calc(100% - 24px));display:flex;flex-direction:column;gap:6px;z-index:30;pointer-events:none}
.toast{background:var(--panel);border:3px solid var(--edge);border-left:8px solid var(--gold);padding:8px 12px;border-radius:6px;font-size:16px;line-height:1.35;box-shadow:0 4px 0 var(--edge);animation:tin .25s ease-out}
.toast.bad{border-left-color:var(--danger)} .toast.good{border-left-color:var(--money)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(10,10,40,.6);display:flex;align-items:flex-end;justify-content:center;z-index:40;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
#modal[hidden]{display:none}
@media (min-width:700px){#modal{align-items:center}}
.sheet{width:min(520px,100%);max-height:min(86vh,740px);overflow-y:auto;background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--line);padding:18px 18px 20px;animation:pop .2s ease-out}
@keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-size:27px;margin:0 0 8px;color:var(--gold);font-weight:700;line-height:1.12}
.sheet h3{font-family:"Chakra Petch","Pixelify Sans","Trebuchet MS",sans-serif;font-size:19px;margin:0 0 4px;font-weight:600}
.sheet p{margin:0 0 12px;line-height:1.5;font-size:16px;max-width:62ch}
.sheet .dim{color:var(--ink-dim);font-size:15px}
.sheet .joke{color:var(--ink-dim);font-style:italic;font-size:15px}
.closeRow{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:14px}
#coach{position:fixed;inset:0;z-index:60}
#coach[hidden]{display:none}
.coach-hole{position:fixed;border:3px solid var(--gold);border-radius:10px;box-shadow:0 0 0 9999px rgba(8,9,32,.74);transition:all .3s ease;pointer-events:none}
.coach-card{position:fixed;background:var(--panel);border:3px solid var(--edge);border-radius:10px;box-shadow:0 6px 0 var(--edge),inset 0 0 0 2px var(--line);padding:14px 16px;transition:top .3s ease,left .3s ease}
.coach-card h3{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:21px;font-weight:700;color:var(--gold);margin:0 0 6px}
.coach-card p{margin:0 0 12px;font-size:15px;line-height:1.45}
.coach-card .coach-step{font-size:13px;color:var(--ink-dim);margin:0 0 2px}
.coach-btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.coach-btns .btn{font-size:15px;padding:8px 12px}
.coach-dots{display:flex;gap:4px;margin:0 0 10px}
.coach-dots i{width:8px;height:8px;border-radius:2px;background:rgba(255,255,255,.2)}
.coach-dots i.on{background:var(--gold)}
.score{background:var(--panel-2);border:2px solid var(--edge);border-radius:10px;padding:12px;margin:0 0 12px}
.score-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.score-total{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:36px;font-weight:700;color:#fff;line-height:1.1}
.grade{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:46px;font-weight:700;line-height:1;color:var(--gold);width:66px;height:66px;display:grid;place-items:center;border:3px solid var(--gold);border-radius:10px;box-shadow:0 4px 0 var(--edge)}
.grade{font-family:"Rubik",system-ui,sans-serif;font-weight:700}
#lawBtn{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:13px;font-weight:600;color:#fff;background:var(--danger);border:2px solid var(--edge);border-radius:6px;padding:2px 7px;cursor:pointer;box-shadow:0 2px 0 var(--edge)}
#lawBtn[hidden]{display:none}
#lawBtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
#rate.warn{color:var(--danger);font-weight:600;animation:blink 1s steps(2) infinite}
.qbar.conf.danger{box-shadow:0 0 0 2px var(--danger);animation:pulse 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,107,107,.35)}}
.law{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:9px 11px;margin:0 0 8px}
.law div{flex:1;min-width:0} .law b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px} .law p{margin:2px 0 0!important;font-size:14px!important;color:var(--ink-dim)}
.law .btn{flex:none;font-size:14px;padding:7px 10px}
.seg.four{grid-template-columns:repeat(4,1fr)} .seg.four .btn{font-size:14px;padding:8px 4px}
@media (prefers-reduced-motion: reduce){ #rate.warn,.qbar.conf.danger{animation:none} }
.newbest{color:var(--money);font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px}
.score .ledger{margin:10px 0 0}
@media (prefers-reduced-motion: reduce){ .coach-hole,.coach-card{transition:none} }
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{background:none;border:0;color:var(--ink-dim);font-size:26px;line-height:1;cursor:pointer;padding:0 4px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.x:focus-visible{outline:3px solid #fff;border-radius:4px}

.claim{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:12px;margin:0 0 10px}
.claim-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.claim-top b{font-size:18px}
.amt{color:var(--gold);font-size:20px;font-weight:700}
.claim p{margin:6px 0 8px;font-size:16px}
.pat{height:7px;background:var(--edge);border-radius:3px;overflow:hidden}
.pat i{display:block;height:100%;background:var(--money)}
.pat.low i{background:var(--danger)}
.patlbl{display:block;font-size:13px;color:var(--ink-dim);margin:3px 0 10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row3 .btn{font-size:15px;padding:9px 6px}
.empty{text-align:center;padding:22px 8px;color:var(--ink-dim)}

.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 16px}
.type{display:flex;flex-direction:column;gap:6px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px;text-align:left;color:var(--ink);font:inherit;cursor:pointer}
.type:hover:not(:disabled){border-color:var(--gold)}
.type:focus-visible{outline:3px solid #fff}
.type:disabled{opacity:.5;cursor:not-allowed}
.type .sw{height:16px;border-radius:3px;border:2px solid var(--edge)}
.type b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.type span{font-size:14px;line-height:1.4;color:var(--ink-dim)}
.flist{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.frow .sw{width:14px;align-self:stretch;border-radius:3px;border:2px solid var(--edge)}
.frow .nm{flex:1;min-width:0;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:16px}
.frow .btn{font-size:14px;padding:7px 9px}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:9px;height:9px;background:rgba(255,255,255,.2);border:1px solid var(--edge)}
.pips i.on{background:var(--gold)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fact{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px}
.fact span{display:block;font-size:14px;color:var(--ink-dim)}
.fact b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:19px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.seg .btn{font-size:15px}
.seg .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}
.designs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 6px}
.designs .btn{font-size:14px;padding:8px 6px}
.intel{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 10px}
.intel div{background:rgba(0,0,0,.22);border:2px solid var(--edge);border-radius:6px;padding:5px 7px;min-width:0}
.intel span{display:block;font-size:13px;color:var(--ink-dim)}
.intel b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px;font-weight:600}
.intel .lock{color:var(--ink-dim);font-size:13px;font-family:"Rubik",sans-serif;font-weight:500}
.intel .bad,.intel .sev3{color:var(--danger)} .intel .good,.intel .sev1{color:var(--money)} .intel .sev2{color:var(--gold)}
.sheet .intel-hint{font-size:14px;color:var(--ink-dim);margin:0 0 10px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.designs .btn[aria-pressed="false"]{background:#5A5D9A;color:#fff}

.ledger{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.ledger td{padding:6px 0;border-bottom:2px dashed var(--line)}
.ledger td:last-child{text-align:right;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.ledger tr.total td{border-bottom:0;font-weight:700;padding-top:10px}
.ledger tr.total td:last-child{font-size:21px}
.ledger tr.exp td{color:var(--ink-dim);border-bottom:0}
.pos{color:var(--money)} .neg{color:var(--danger)}
.move{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 12px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.move b{font-size:20px} .move em{font-style:normal;font-size:24px;font-weight:700}
.move.up em{color:var(--money)} .move.down em{color:var(--danger)}
blockquote{margin:0 0 12px;padding:10px 14px;border-left:5px solid var(--gold);background:rgba(255,255,255,.05);font-size:16px;line-height:1.45;border-radius:0 6px 6px 0}
blockquote cite{display:block;font-style:normal;color:var(--ink-dim);font-size:14px;margin-top:4px}
.note{background:rgba(255,107,107,.12);border:2px solid rgba(255,107,107,.4);border-radius:6px;padding:8px 10px;font-size:14px!important}
.big{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:48px;color:var(--gold);line-height:1;margin:6px 0 8px}
.spark{width:100%;height:80px;display:block;margin:6px 0 4px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px}
.action{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 8px}
.action p{margin:0;font-size:15px;color:var(--ink-dim)}
.action .btn{flex:none;font-size:15px}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.choices .btn{text-align:left;font-size:17px}
.pbtn{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:14px;font-weight:600;color:#2A1E00;background:var(--gold);border:2px solid var(--edge);border-radius:6px;padding:3px 9px;box-shadow:0 2px 0 var(--edge);cursor:pointer}
.pbtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.pbtn.on{background:var(--money)}
.qbar.conf i{background:var(--money);transition:width .4s,background .4s}
#mktTxt{flex:none;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-weight:600}
#pauseOv{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(18,19,58,.55);backdrop-filter:blur(2px);cursor:pointer}
#pauseOv[hidden]{display:none}
#pauseOv div{background:var(--panel);border:3px solid var(--edge);border-radius:10px;padding:16px 26px;text-align:center;box-shadow:0 5px 0 var(--edge)}
#pauseOv b{display:block;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:30px;color:var(--gold)}
#pauseOv span{font-size:15px;color:var(--ink-dim)}
.sheet.intro h2{font-size:23px}
.sheet.intro p{font-size:15px;line-height:1.45}
.intro-scroll{max-height:min(42vh,320px);overflow-y:auto;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.intro-scroll p{display:flex;gap:9px;align-items:flex-start;margin:0 0 10px;font-size:14px!important;line-height:1.4}
.intro-scroll p:last-child{margin-bottom:0}
.intro-scroll .intro-h{font-size:17px;color:var(--gold);margin:14px 0 8px;padding-top:10px;border-top:2px dashed var(--line)}
.intro-scroll .isw{flex:none;width:14px;height:14px;margin-top:3px;border:2px solid var(--edge);border-radius:3px}
.intro-scroll .intro-room em{display:block;font-style:normal;margin-top:2px}
.intro-scroll .intro-room em.pro{color:var(--money)}
.intro-scroll .intro-room em.con{color:#FF9B9B}
.intro-scroll .intro-tip{background:rgba(255,210,63,.1);border-radius:6px;padding:6px 8px}
.intro-scroll p span:first-child{flex:none;font-size:18px;line-height:1.2}
.type .pro,.pc .pro{color:var(--money)} .type .con,.pc .con{color:#FF9B9B}
.pc{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;margin:0 0 12px}
.pc p{margin:0 0 4px!important;font-size:15px!important} .pc p:last-child{margin:0!important}
.stars{font-size:30px;letter-spacing:4px;color:var(--gold);text-align:center;margin:0 0 6px;font-family:"Chakra Petch","Pixelify Sans",sans-serif}
.reward{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 12px}
.reward div{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:6px 8px}
.reward span{display:block;font-size:13px;color:var(--ink-dim)} .reward b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 12px}
.ach{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:7px 9px;font-size:14px;opacity:.55}
.ach.on{opacity:1;border-color:var(--gold)} .ach b{display:block;font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:15px}
.swan h2{color:var(--danger)!important}
.status{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
.status div{background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:6px 8px}
.status span{display:block;font-size:13px;color:var(--ink-dim)} .status b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;font-size:17px}
.goals{list-style:none;margin:6px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.goals li{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:2px solid var(--edge);border-radius:8px;padding:8px 10px;font-size:16px;line-height:1.3}
.goals li i{flex:none;width:20px;height:20px;border:2px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-style:normal;font-weight:700;color:#12133A}
.goals li.ok i{background:var(--money)}
.goals li span{flex:1}
.goals li b{font-family:"Chakra Petch","Pixelify Sans",sans-serif;color:var(--ink-dim);white-space:nowrap}
.goals li.ok b{color:var(--money)}
.ledger small{font-size:13px;color:var(--ink-dim)}
.howto p{display:flex;gap:10px;align-items:flex-start}
.howto p span{flex:none;font-size:22px;line-height:1.2}

/* ---------- Animation (runs even when paused) ---------- */
function animate(dt){
  if (bell.t > 0) bell.t -= dt;
  weather.t -= dt; if (weather.t <= 0){ weather.rain = !weather.rain; weather.t = weather.rain ? rand(15,30) : rand(18,35); }
  if (weather.rain) for (const d of drops){ d.y += d.s*dt; d.x -= d.s*0.15*dt; if (d.y > LH){ d.y = -5; d.x = rand(0, LW+40); } }
  for (const c of cars){ if (c.wait > 0){ c.wait -= dt; continue; } c.x += c.sp*dt; if (c.x > LW + 10){ c.x = -40; c.wait = rand(6,18); } }
  for (const c of clouds){ c.x += c.s*dt; if (c.x > LW + 10) { c.x = -c.w - 5; c.y = rand(6,60); } }
  for (const ws of W) for (const w of (ws || [])){
    if (w.mode !== "walk") continue;
    if (w.pause > 0){ w.pause -= dt; continue; }
    w.x += w.dir*w.sp*dt;
    if (w.x < w.lo){ w.x = w.lo; w.dir = 1; } if (w.x > w.hi){ w.x = w.hi; w.dir = -1; }
    if (Math.random() < dt*0.25){ w.pause = rand(1,3); if (Math.random() < .5) w.dir *= -1; }
  }
  const L = layout();
  const stops = [L.lobbyY + 18]; for (let i = 0; i < L.n; i++) stops.push(floorY(L,i) + 16);
  if (!elev.init){ elev.y = elev.ty = stops[0]; elev.init = true; }
  if (Math.abs(elev.ty - elev.y) < 0.5){ elev.y = elev.ty; elev.wait -= dt; if (elev.wait <= 0){ elev.ty = pick(stops); elev.wait = rand(1.5,3.5); } }
  else elev.y += Math.sign(elev.ty - elev.y)*Math.min(Math.abs(elev.ty-elev.y), 40*dt);
  if (!stops.some(s => s === elev.ty)) elev.ty = stops[0];
  const shown = S.claims.slice(0,6);
  shown.forEach((c,k) => {
    let u = CUST.find(u => u.id === c.id && u.state !== "out");
    if (!u){ u = {id:c.id, x:34, state:"wait", face:1, moving:false, mood:null,
      look:{skin:pick(SKINS), hair:pick(HAIRS), shirt:pick(CUST_SHIRTS), pants:pick(["#2B2D52","#4A6FA5","#6B4A2B","#3A3F6B"]), style:Math.random()<.5?0:1, hat:Math.random()<.6}};
      CUST.push(u); }
    u.tx = 140 - k*15;
  });
  for (const u of CUST){
    if (u.state === "wait" && !S.claims.some(c => c.id === u.id)) u.state = "out";
    if (u.state === "wait" && !shown.some(c => c.id === u.id)) u.state = "out";
    const tx = u.state === "out" ? 30 : u.tx;
    const d = tx - u.x;
    if (Math.abs(d) > 0.5){ u.x += Math.sign(d)*Math.min(Math.abs(d), (u.state==="out"?26:20)*dt); u.face = Math.sign(d); u.moving = true; }
    else { u.moving = false; if (u.state === "wait") u.face = 1; }
  }
  CUST = CUST.filter(u => !(u.state === "out" && u.x <= 31));
}

    toast(pick(["Leaked: PR’s plan to rename claim denials “customer journeys.” The internet is not amused.","Leaked: a PR memo titled “How to say sorry without saying sorry.” Mood and confidence take a hit.","Leaked: PR paid an influencer to praise your hold music. The influencer posted the invoice."]), "bad"); } }
  if (S.hrAt != null){ S.hrAt -= dt; if (S.hrAt <= 0){ S.hrAt = null; S.hrSlump = 30; sfx("warn");
    toast(pick(["HR announced a mandatory fun day. Everyone is 25% slower for 30 seconds.","HR is running a trust-fall workshop. Productivity has fallen, and so has Kevin.","HR reorganised every team into “pods.” Nobody knows which pod they’re in. Everything slows down."]), "bad"); } }
  if (S.hrSlump > 0) S.hrSlump = Math.max(0, S.hrSlump - dt);
  if (capReq() > 0 && S.cash < capReq() && S.capWarnQ !== S.quarter){ S.capWarnQ = S.quarter; sfx("warn"); toast(`Your capital is below what the regulator requires (${fmt(capReq())}). Below 80% of that at an earnings call means a warning.`, "bad"); }
  if (S.rivalT != null){ S.rivalT -= dt; if (S.rivalT <= 0){ S.rivalT = null; rivalPoach(); if (modalOpen) return; } }
  if (S.outage > 0){ S.outage -= dt; if (S.outage <= 0){ S.outage = 0; toast("IT is back up. They turned it off and on again.", "good"); } }
  checkAch();

  S.qt += dt;
  if (S.qt >= Q_LEN){ S.qt = 0; earnings(); return; }
  checkRank();
  S.nextEvent -= dt;
  if (S.nextEvent <= 0 && S.qt < Q_LEN - 6){ S.nextEvent = rand(40,65); fireEvent(); }
}

/* ---------- FX and toasts ---------- */
function pop(text, lx, ly, cls){
  if (!scene) return;
  cls = cls || "";
  const stamp = cls.includes("stamp"), bad = cls.includes("bad"), ok = cls.includes("ok");
  const style = {fontFamily:FONT, fontSize:pxL(stamp ? 14 : 16)+"px", fontStyle:"700", color: stamp ? "#FFFFFF" : bad ? "#FF6B6B" : "#4BE39A", resolution:Math.ceil(cz)};
  if (stamp){ style.backgroundColor = ok ? "#2FB879" : "#FF6B6B"; style.padding = {x:pxL(5), y:pxL(1)}; }
  else { style.stroke = "#12133A"; style.strokeThickness = pxL(3); }
  const t = scene.add.text(OX + lx, ly, text, style).setOrigin(0.5, 1).setDepth(30);
  if (stamp){ t.setAngle(-8); t.setScale(1.4); scene.tweens.add({targets:t, scale:1, duration:180, ease:"Back.easeOut"}); }
  scene.tweens.add({targets:t, y:ly - pxL(42), alpha:0, delay:250, duration:1250, ease:"Cubic.easeIn", onComplete:() => t.destroy()});
}
function fxConfetti(){
  sfx("fanfare");
  if (!scene || !confettiEm) return;
  const cam = scene.cameras.main, vh = viewH();
  [0.25, 0.5, 0.75].forEach((fx, k) => setTimeout(() => confettiEm.explode(40, LW*fx, cam.scrollY + vh*0.25), k*140));
}
function fxShake(){ if (scene) scene.cameras.main.shake(320, 0.006); }
function toast(msg, kind){
  const box = $("#toasts");
  const el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = msg;
  box.appendChild(el); while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => el.remove(), 5000);
}

  $("#sheet").innerHTML = html; $("#modal").hidden = false; $("#sheet").scrollTop = keepScroll;
  modalOpen = true; modalCb = opts.onClose || null; modalLocked = !!opts.locked; view = opts.view || null;

function build(type){
  const cost = buildCost();
  if (S.cash < cost || S.floors.length >= MAXF) return;
  if (!isUnlocked(type)) return;
  S.cash -= cost; discSpent += cost;
  S.floors.push({type, level:1, mode:"pay"});
  rebuildWorkers(S.floors.length-1);
  closeModal();
  toast(`Built: ${TYPES[type].name}. ${TYPES[type].joke}`, "good");
  save();
}
function upgrade(i, back){
  const f = S.floors[i]; const c = upCost(f);
  if (f.level >= MAXL || S.cash < c) return;
  S.cash -= c; discSpent += c; f.level++; rebuildWorkers(i);
  const L = layout(); pop("Level "+f.level+"!", 100, floorY(L,i)+16, "");
  if (back === "floors") openFloors(); else openFloor(i);
  save();
}

/* Earnings */
function earnings(){
  const q = S.q;
  const notes = [];
  q.cover = 0;
  for (const k of Object.keys(COVERS)) if (S.cover[k]){
    const c = coverCost(k, q.prem);
    if (S.cash >= c){ S.cash -= c; q.cover += c; }
    else { S.cover[k] = false; notes.push(`You couldn’t afford to renew ${COVERS[k].name.toLowerCase()}. It has lapsed.`); }
  }
  q.loan = 0;
  if (S.loan){
    const pay = Math.min(S.loan.per, S.loan.left);
    S.cash -= pay; S.loan.left -= pay; q.loan = Math.min(S.loan.interest, pay);
    if (S.loan.left <= 0){ S.loan = null; notes.push("Your bank loan is fully repaid."); }
  }
  q.inv = 0;
  if (lv("invest")){ const cap = invCapital(), st = INV[S.invRisk || 0]; q.inv = Math.round(cap*(st.mean + st.sd*gauss())); S.cash += q.inv; S.invLast = q.inv;
    if (q.inv < 0) notes.push(`Your ${st.name.toLowerCase()} investments lost ${fmt(-q.inv)} this quarter.`); }
  const profit = q.prem - q.paid - q.sal - q.other - q.cover - q.loan + q.inv;
  const hist = (S.profHist || []).slice(-3), g = growthRate();
  const avg = hist.length ? hist.reduce((a, b) => a + b, 0)/hist.length : 0;
  const expected = avg > 0 ? Math.max(40, avg*(1+g)) : 40;
  const basis = avg > 0 && avg*(1+g) > 40 ? `Your average profit over the last ${hist.length === 1 ? "quarter" : hist.length + " quarters"} (${fmt(avg)}), plus ${Math.round(g*100)}%.` : `Their minimum. They never accept less than ${fmt(40)}.`;
  const surprise = (profit - expected)/Math.max(Math.abs(expected), 40);
  const inLine = profit >= 0 && surprise < 0 && surprise >= -0.05;
  let ch = clamp(surprise*0.2, -0.25, 0.35); const ir = lv("ir");
  if (ch > 0) ch *= 1 + 0.15*ir; else ch *= Math.max(0.3, 1 - 0.12*ir);
  if (S.aiHype){ ch += 0.06; notes.push("You said “AI” forty times. Analysts added 6% out of reflex."); S.aiHype = false; }
  if (S.happy < 25){ ch -= 0.05; notes.push("A sustainability fund sold your stock over customer complaints. Share price down 5%."); }
  const gap = compGap();
  let strike = false;
  const gouged = priceIdx() === 3 && Math.random() < 0.35;
  const capShort = capReq() > 0 && S.cash < capReq()*0.8;
  if (!capShort && capReq() > 0 && S.cash < capReq()) notes.push(`Your capital is ${Math.round(capRatio()*100)}% of what the regulator requires. That’s within tolerance, but below 80% you’ll get a warning.`);
  if (gap > 0 || S.happy < 20 || gouged || capShort){
    strike = true; S.strikes++; S.cleanQ = 0; S.cleanRun = 0;
    const fine = Math.round(Math.max(100, Math.max(0, S.cash)*0.1)*(perk("lobbyist") ? 0.6 : 1)*prDamp()); S.cash -= fine;
    notes.push(`Regulator warning ${S.strikes} of ${maxStrikes()}: ${gap > 0 ? `Compliance only covers ${compHave()} of the ${compNeed()} floors it needs to` : capShort ? `you hold ${fmt(Math.max(0, S.cash))} but must hold ${fmt(capReq())} in capital` : S.happy < 20 ? "customers are miserable" : "your prices failed the fair-value test"}. Fine: ${fmt(fine)}.${S.strikes >= maxStrikes() ? "" : " Two clean quarters remove a warning."}`);
  } else {
    S.cleanQ++; S.cleanRun = (S.cleanRun || 0) + 1;
    if (S.strikes > 0 && S.cleanQ >= 2){ S.strikes--; S.cleanQ = 0; notes.push("The regulator removed one of your warnings. Keep it clean."); }
  }
  const old = S.stock; S.stock = Math.max(0.5, S.stock*(1+ch));
  S.hist.push(S.stock); if (S.hist.length > 40) S.hist.shift();
  const qn = S.quarter; S.quarter++; S.lastProfit = profit; S.q = blankQ();
  S.profHist = (S.profHist || []).concat([profit]).slice(-3);
  S.streak = profit >= expected ? (S.streak || 0) + 1 : inLine ? (S.streak || 0) : 0;
  S.bestStreak = Math.max(S.bestStreak || 0, S.streak);
  S.bestProfit = Math.max(S.bestProfit || 0, profit);
  const stars = (profit < 0 || surprise < 0) ? 0 : surprise >= 0.6 ? 3 : surprise >= 0.25 ? 2 : 1;
  const bonus = stars ? Math.round(B()*0.35*stars/10)*10 : 0;
  if (bonus) S.cash += bonus;
  S.stars += stars; S.favour += stars; if (stars === 3) S.best3 = true;
  let dc = stars ? 5 + 3*stars + Math.min(S.streak, 5) : profit < 0 ? -20 : inLine ? 2 : -Math.round(4 + 12*Math.min(1, -surprise));
  if (S.happy < 25) dc -= 6;
  if (strike) dc -= 10;
  if (dc < 0) dc = Math.round(dc*prDamp());
  S.conf = clamp(S.conf + dc, 0, 100);
  const oldDiff = S.diff;
  { let dd = 0.02 + (stars ? 0.05 + 0.04*stars : -0.1); if (dd > 0 && S.diff > 3) dd /= (S.diff - 2); S.diff = Math.max(1, 1 + 0.035*qn, S.diff + dd); }
  if (qn >= 9 && S.rivalT == null && Math.random() < Math.min(0.6, 0.15 + 0.08*Math.max(0, S.diff - 2) + 0.01*Math.max(0, S.floors.length - 10))) S.rivalT = rand(10, 50);
  if (S.idleMode && qn > 4 && Math.random() < 0.22*Math.min(1, (qn - 4)/8)){
    const bl = pick(BLUNDERS), cost = Math.round(Math.max(150, Math.abs(profit)*bl.k)/10)*10;
    S.cash -= cost; if (bl.conf) S.conf = clamp(S.conf - bl.conf, 0, 100); if (bl.mood) mood(-bl.mood);
    notes.push(`Board blunder: ${bl.text} It cost ${fmt(cost)}.`);
  }
  if (lv("pr") && S.prLeakAt == null && Math.random() < Math.min(0.3, 0.05*lv("pr"))) S.prLeakAt = rand(8, 50);
  if (lv("hr") && S.hrAt == null && Math.random() < Math.min(0.4, 0.08*lv("hr"))) S.hrAt = rand(8, 50);
  if (lv("it") > 0 && S.outageAt == null && Math.random() < Math.min(0.4, 0.06*lv("it"))) S.outageAt = rand(8, 50);
  if (qn >= 3 && !S.swan && Math.random() < (0.012 + 0.006*(S.diff - 1))*(S.idleMode && qn > 8 ? 2.5 : 1)){
    S.swan = {t:rand(12, 48), kind:pick(["storm","storm","tornado","tornado","bridge","bridge","ash","cyber","cyber","scandal","scandal","crash"]), warned:false};
  }
  if (qn % 8 === 0) notes.push("New regulations: a 400-page rulebook just landed. Compliance must now cover one more floor than before.");
  if (qn === 5) notes.push("Coming next quarter: capital rules. The regulator will require you to hold cash in proportion to the premiums you write. Catastrophe reinsurance and Cat Modelling reduce how much.");
  if (qn === 3) notes.push("Black swans are rare, once-in-a-lifetime disasters. Most games never see one, but from now on one could strike. Your own insurance is in the Boardroom.");
  const qLabel = `Q${((qn-1)%4)+1}, year ${Math.ceil(qn/4)}`;
  let lede, quote;
  if (profit < 0){ lede = "You lost money this quarter."; quote = pick(["“Is the building on fire? Asking for a client.”","“We’re downgrading you to ‘Hold your breath.’”","“Bold strategy. Incorrect, but bold.”"]); }
  else if (inLine){ lede = "You came in right on expectations, give or take."; quote = pick(["“In line. We yawned, but in a positive way.”","“Steady. Boring. Acceptable.”","“Neither exciting nor alarming. Like a beige carpet.”"]); }
  else if (surprise < 0){ lede = `You missed the City’s expectations by ${fmt(expected-profit)}.`; quote = pick([`“You made ${fmt(profit)}. We expected ${fmt(expected)}. We are in mourning.”`,"“Disappointing. Have you tried firing someone?”","“A profit, sure. But was it enough profit?”"]); }
  else if (surprise > 0.3){ lede = "You crushed the City’s expectations."; quote = pick(["“Exceptional. Do it again, but more.”","“We’re upgrading you to ‘Buy, immediately, with both hands.’”","“I just named my son after your margins.”"]); }
  else { lede = "You beat the City’s expectations."; quote = pick(["“Solid quarter. Next time we’ll expect 12% more, for no reason.”","“Cautiously ecstatic.”","“Fine. Good, even. Don’t let it go to your head.”"]); }
  const pct = (S.stock/old - 1)*100;
  bell.t = 3; bell.n = profit >= expected ? 2 : 1; lede += profit >= expected ? " In The Room, the bell rings twice." : " In The Room, the bell rings once.";
  openModal(`<h2>Earnings call, ${qLabel}</h2>
    <div class="stars" aria-label="${stars} of 3 stars">${"★".repeat(stars)}${"☆".repeat(3 - stars)}</div>
    <p>${lede}${S.streak > 1 ? ` That’s ${S.streak} quarters in a row.` : ""}</p>
    <div class="reward">
      <div><span>Board bonus</span><b class="${bonus ? "pos" : ""}">${bonus ? "+" + fmt(bonus) : "None"}</b></div>
      <div><span>Board confidence</span><b class="${dc >= 0 ? "pos" : "neg"}">${dc >= 0 ? "+" : "−"}${Math.abs(dc)} (${Math.round(S.conf)}%)</b></div>
      <div><span>Competition</span><b>${mktName().replace(" market","")}${S.diff > oldDiff + 0.04 ? " ↑" : S.diff < oldDiff ? " ↓" : ""}</b></div>
    </div>
    <table class="ledger">
      <tr><td>Premiums collected</td><td class="pos">+${fmt(q.prem)}</td></tr>
      <tr><td>Claims paid</td><td class="neg">−${fmt(q.paid)}</td></tr>
      <tr><td>Salaries</td><td class="neg">−${fmt(q.sal)}</td></tr>
      <tr><td>Lawsuits, fines and “other”</td><td class="neg">−${fmt(q.other)}</td></tr>
      <tr><td>Your own insurance</td><td class="neg">−${fmt(q.cover)}</td></tr>
      ${q.inv ? `<tr><td>Investment returns</td><td class="${q.inv >= 0 ? "pos" : "neg"}">${q.inv >= 0 ? "+" : "−"}${fmt(Math.abs(q.inv))}</td></tr>` : ""}
      ${q.loan ? `<tr><td>Loan interest</td><td class="neg">−${fmt(q.loan)}</td></tr>` : ""}
      <tr class="total"><td>Profit</td><td class="${profit>=0?"pos":"neg"}">${fmt(profit)}</td></tr>
      <tr class="exp"><td>The City expected<br><small>${basis}</small></td><td>${fmt(expected)}</td></tr>
      ${capReq() ? `<tr class="exp"><td>Capital the regulator requires<br><small>You hold ${fmt(Math.max(0, S.cash))}</small></td><td class="${S.cash < capReq() ? "neg" : ""}">${fmt(capReq())}</td></tr>` : ""}
    </table>
    <div class="move ${pct>=0?"up":"down"}"><span>Share price<br><b>${fmt2(old)} to ${fmt2(S.stock)}</b></span><em>${pct>=0?"+":"−"}${Math.abs(pct).toFixed(1)}%</em></div>
    <blockquote>${quote}<cite>An analyst who has never bought insurance</cite></blockquote>
    ${notes.map(n => `<p class="note">${n}</p>`).join("")}

}
function checkRank(){
  const next = RANKS[S.rankIdx + 1]; if (!next) return;

/* ---------- Score ---------- */
function daysSurvived(){ return Math.floor((S.quarter - 1)*91 + S.qt/Q_LEN*91); }

function scoreParts(){

}

    hole.style.cssText = `left:${W/2}px;top:${H/2}px;width:0;height:0;border-width:0`;
    card.style.left = (W - cw)/2 + "px"; card.style.top = Math.max(12, (H - ch)/2) + "px";
    return;
  }
  const r = el.getBoundingClientRect(), pad = 6;
  hole.style.cssText = `left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad*2}px;height:${r.height + pad*2}px`;
  let top;
  if (r.bottom + pad + 12 + ch < H - 8) top = r.bottom + pad + 12;
  else if (r.top - pad - 12 - ch > 8) top = r.top - pad - 12 - ch;
  else top = Math.max(12, (H - ch)/2);
  card.style.top = top + "px";
  card.style.left = clamp(r.left + r.width/2 - cw/2, 12, W - cw - 12) + "px";

function divAmt(){ const h = (S.profHist || []).filter(x => x > 0); const avg = h.length ? h.reduce((a, b) => a + b, 0)/h.length : B(); return Math.round(Math.max(150, avg*0.4)/10)*10; }
function cashCallAmt(){ return Math.round(Math.max(1000, baseIncome()*Q_LEN*1.0)/10)*10; }
function loanAmt(){ return Math.round(Math.max(800, baseIncome()*Q_LEN*0.8)/10)*10; }
function settleCost(l){ return lv("legal") ? Math.round(l.amt*(l.win != null ? l.win : 0.85)*0.6) : Math.round(l.amt*0.5); }
const cashSamples = [];
let discSpent = 0;
function sampleCash(){ cashSamples.push(S.cash + discSpent); if (cashSamples.length > 20) cashSamples.shift(); }
function runway(){
  if (cashSamples.length < 8) return null;
  const slope = (cashSamples[cashSamples.length - 1] - cashSamples[0])/(cashSamples.length - 1);
  if (slope >= -0.5) return null;
  const left = S.cash + overdraft();
  return left <= 0 ? 0 : left/(-slope);
}

}

const SND = {ctx:null, master:null, muted:false, last:{}, rain:null, rainWanted:false, buf:null};
try { SND.muted = localStorage.getItem("fineprint-muted") === "1"; } catch(e){}
function audioInit(){
  if (SND.ctx){ if (SND.ctx.state === "suspended") SND.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  SND.ctx = new AC(); SND.master = SND.ctx.createGain(); SND.master.gain.value = SND.muted ? 0 : 0.5; SND.master.connect(SND.ctx.destination);
  const c = SND.ctx, b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1;
  SND.buf = b; setRainSound(SND.rainWanted);
}
window.addEventListener("pointerdown", audioInit, {capture:true});

function tone(f, t0, dur, type, vol, slide){
  const c = SND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f*slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(SND.master); o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(t0, dur, vol, freq, type){
  const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = SND.buf; f.type = type || "lowpass"; f.frequency.value = freq || 800;
  g.gain.setValueAtTime(vol || 0.2, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(SND.master); src.start(t0); src.stop(t0 + dur + 0.05);
}
function buzz(p){ try { if (!SND.muted && navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function sfx(name, n){
  const BZ = {gavel:40, swan:[80,60,140], lose:[60,40,200], build:15, warn:25};
  if (BZ[name] && !(SND.last["bz" + name] && performance.now() - SND.last["bz" + name] < 400)){ SND.last["bz" + name] = performance.now(); buzz(BZ[name]); }
  if (!SND.ctx || SND.muted || SND.ctx.state !== "running") return;
  const now = SND.ctx.currentTime, gap = {coin:1.4, tick:0.05, pay:0.12, stamp:0.12}[name] || 0.08;
  if (SND.last[name] && now - SND.last[name] < gap) return;
  SND.last[name] = now; const t = now + 0.01;
  switch (name){
    case "coin": tone(1320,t,0.07,"square",0.03); tone(1760,t+0.06,0.09,"square",0.03); break;
    case "pay": tone(880,t,0.07,"square",0.07); tone(1320,t+0.07,0.12,"square",0.07); noise(t+0.02,0.05,0.04,6000,"highpass"); break;
    case "stamp": noise(t,0.12,0.35,420); tone(110,t,0.12,"sine",0.25,0.5); break;
    case "paper": noise(t,0.2,0.12,3000,"bandpass"); break;
    case "gavel": noise(t,0.07,0.4,500); tone(150,t,0.1,"triangle",0.25,0.6); noise(t+0.22,0.07,0.4,500); tone(150,t+0.22,0.1,"triangle",0.25,0.6); break;
    case "chime": [784,988,1175].forEach((f,k) => tone(f,t+k*0.08,0.25,"triangle",0.08)); break;
    case "bell": for (let k = 0; k < (n || 1); k++){ const tt = t + k*0.55; tone(660,tt,1.4,"sine",0.16); tone(1650,tt,0.7,"sine",0.05); tone(990,tt,1.0,"triangle",0.04); } break;
    case "build": noise(t,0.25,0.3,300); tone(196,t,0.2,"triangle",0.2,0.7); [523,659,784].forEach((f,k) => tone(f,t+0.3+k*0.07,0.15,"square",0.05)); break;
    case "upgrade": [523,659,784,1047].forEach((f,k) => tone(f,t+k*0.06,0.12,"square",0.05)); break;
    case "fanfare": [523,659,784,1047,784,1047].forEach((f,k) => tone(f,t+k*0.09,0.18,"square",0.05)); break;
    case "swan": tone(70,t,1.6,"sawtooth",0.16,0.5); noise(t,1.5,0.3,200); break;
    case "lose": [392,330,262,196].forEach((f,k) => tone(f,t+k*0.22,0.35,"triangle",0.12)); break;
    case "warn": tone(440,t,0.12,"square",0.06); tone(330,t+0.14,0.16,"square",0.06); break;
    case "tick": tone(1800,t,0.03,"square",0.02); break;
  }
}
function setRainSound(on){
  SND.rainWanted = on;
  if (!SND.ctx) return;
  if (on && !SND.muted && !paused && !SND.rain){
    const c = SND.ctx, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = SND.buf; src.loop = true; f.type = "lowpass"; f.frequency.value = 1400; g.gain.value = 0.0001;
    g.gain.exponentialRampToValueAtTime(0.03, c.currentTime + 1.5);
    src.connect(f); f.connect(g); g.connect(SND.master); src.start(); SND.rain = {src, g};
  } else if ((!on || SND.muted || paused) && SND.rain){
    const r = SND.rain, c = SND.ctx; SND.rain = null;
    r.g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.8); r.src.stop(c.currentTime + 0.9);
  }
}
function setMuted(m){
  SND.muted = m; try { localStorage.setItem("fineprint-muted", m ? "1" : "0"); } catch(e){}
  $("#btnSound").textContent = m ? "🔇" : "🔊"; $("#btnSound").setAttribute("aria-label", m ? "Turn sound on" : "Mute sound");

const EXECS = [
  {id:"cos", name:"Chief of Staff", rank:1, sal:0.6, desc:"Handles events and earnings calls for you, always picking the cautious option. The game no longer stops to wait for you.", joke:"Wears a lanyard with seven badges on it."},

function hasExec(id){ return !!(S.idleMode || (S.execs && S.execs[id])); }
function execCount(){ return EXECS.filter(x => hasExec(x.id)).length; }
function execRate(x){ return x.sal*((S.idleMode ? 0 : 0.4) + Math.max(0, baseIncome())*0.03); }
function execCost(){ let c = 0; for (const x of EXECS) if (hasExec(x.id)) c += execRate(x); return c; }
function execBuffer(){ return typicalClaim()*6 + capReq() + Object.keys(COVERS).reduce((a, k) => a + (S.cover[k] ? coverCost(k, income()*Q_LEN) : 0), 0); }
let apT = 0;
function autopilot(dt){
  apT += dt; if (apT < 0.5) return; apT = 0;
  if (hasExec("claims")){
    for (const c of [...S.claims]){
      if (c.max - c.pat < 10) continue;
      let act = lv("risk") >= 2 && legitEst(c) < 50 ? "deny" : "pay";
      if (act === "pay" && lv("risk") < 2 && !c.stalls && c.amount > typicalClaim()*1.3 && S.cash < typicalClaim()*4) act = "stall";
      if (act === "pay" && !canPay(c.amount)) act = c.stalls ? "deny" : "stall";
      if (S.idleMode && S.quarter > 3 && act !== "stall" && Math.random() < 0.15*Math.min(1, (S.quarter - 3)/10)) act = act === "pay" ? "deny" : (canPay(c.amount) ? "pay" : "deny");
      resolve(c, act, "you");
    }
  }
  if (hasExec("cro")){
    for (const k of Object.keys(COVERS)){ const cost = coverCost(k, income()*Q_LEN); if (!S.cover[k] && S.quarter >= (S.idleMode ? 4 : 3) && S.cash > cost*4 && (!S.idleMode || Math.random() < 0.015)){ S.cash -= cost; discSpent += cost; S.cover[k] = true; toast(`Your Chief Risk Officer bought ${COVERS[k].name.toLowerCase()}.`); } }
    for (let k = S.lawsuits.length - 1; k >= 0; k--){ const l = S.lawsuits[k], cost = settleCost(l); if ((l.win != null ? l.win : 0.85) >= 0.5 && S.cash > cost*2){ spend(cost, "other"); S.lawsuits.splice(k, 1); toast(`Your Chief Risk Officer settled with ${l.name || "a former customer"} for ${fmt(cost)}.`); } }
  }
  if (hasExec("cco") && compGap() >= 0 && S.floors.length >= 3){
    const cf = S.floors.filter(f => f.type === "compliance" && f.level < MAXL).sort((a, b) => a.level - b.level)[0];
    if (compGap() > 0 || S.qt > 35){
      if (cf && S.cash - execBuffer() > upCost(cf)){ S.cash -= upCost(cf); discSpent += upCost(cf); cf.level++; rebuildWorkers(S.floors.indexOf(cf)); toast("Your Chief Compliance Officer upgraded Compliance."); }
      else if (!cf && S.floors.length < MAXF && S.cash - execBuffer() > buildCost()){ const c = buildCost(); S.cash -= c; discSpent += c; S.floors.push({type:"compliance", level:1, mode:"pay"}); rebuildWorkers(S.floors.length-1); toast("Your Chief Compliance Officer built a Compliance floor."); }
    }
  }
  if (hasExec("cfo")){
    const cn = cycleName(); let want = cn === "Hard market" ? 2 : (cn === "Soft market" && S.happy < 50) ? 0 : 1;
    if (S.idleMode){ if (S.bpCycle !== cn){ S.bpCycle = cn; S.bpPick = S.quarter > 4 && Math.random() < 0.3 ? Math.floor(Math.random()*4) : want; } want = S.bpPick; }
    if (priceIdx() !== want && (S.idleMode || priceIdx() !== 3)){ S.price = want; toast(`${S.idleMode ? "The board" : "Your CFO"} switched pricing to ${PRICES[want].name.toLowerCase()} for the ${cn.toLowerCase()}.${S.idleMode && want === 3 ? " Bold." : ""}`, want === 3 ? "bad" : ""); }
    if (S.divQ !== S.quarter && S.conf < 70 && S.qt > 45 && S.cash > divAmt() + execBuffer()){ const a = divAmt(); S.cash -= a; discSpent += a; S.divQ = S.quarter; S.conf = clamp(S.conf + 8, 0, 100); S.stock *= 1.03; toast(`Your CFO paid a ${fmt(a)} dividend to calm the board.`, "good"); }
    const run = runway();
    if (run != null && run < 30 && !S.loan){ const a = loanAmt(), tot = Math.round(a*1.25); S.cash += a; discSpent -= a; S.loan = {left:tot, per:Math.ceil(tot/4), interest:Math.round((tot - a)/4)}; toast(`Your CFO took out a ${fmt(a)} loan to keep the lights on.`, "bad"); }
  }
  if (S.idleMode) idleAutopilot();
  if (hasExec("coo") && (!S.idleMode || (S.cooCd = (S.cooCd || 0) - 0.5) <= 0)){
    const buffer = S.floors.length < 5 ? typicalClaim()*2 + capReq() : execBuffer()*1.5;
    const want = {sales:5, claims:2, marketing:1, actuary:1, legal:1, risk:1, it:1, ir:1};
    const boxes = S.floors.filter(f => f.type === "sales"), boxAvg = boxes.length ? boxes.reduce((a, f) => a + f.level, 0)/boxes.length : 0;
    const avgLvl = S.floors.reduce((a, f) => a + f.level, 0)/Math.max(1, S.floors.length);
    if (S.floors.length < MAXF && (S.floors.length < 3 || (boxAvg >= 2 && avgLvl >= 2.2)) && S.cash - buffer > buildCost()*1.3){
      const need = (isUnlocked("compliance") && S.floors.length >= 3 && compNeed() + 1 > compHave() && !S.floors.some(f => f.type === "compliance" && f.level < MAXL)) ? "compliance" : S.floors.filter(f => f.type === "sales").length < 3 ? "sales" : Object.keys(want).filter(t => isUnlocked(t)).map(t => [t, S.floors.filter(f => f.type === t).length/want[t]]).sort((a, b) => a[1] - b[1])[0][0];
      if (S.floors.length >= 3 && compNeed() + 1 > compHave() && need !== "compliance") { /* a Compliance upgrade is cheaper: leave it to the Compliance Officer this time */ }
      else {
      const odd = S.idleMode && S.quarter > 4 && need !== "compliance" && Math.random() < 0.12;
      const kind = odd ? pick(ORDER.filter(t => isUnlocked(t) && t !== need)) || need : need;
      const c = buildCost(); S.cash -= c; discSpent += c; S.floors.push({type:kind, level:1, mode:"pay"}); rebuildWorkers(S.floors.length-1); if (S.idleMode) S.cooCd = 20;
      toast(odd ? `The board built a ${TYPES[kind].name} nobody asked for. Someone’s nephew runs it.` : `Your COO built a new ${TYPES[kind].name}.`, odd ? "bad" : "");
      }
    } else {
      const f = S.floors.filter(f => f.level < MAXL && f.type !== "compliance").sort((a, b) => a.level - b.level || (a.type === "sales" ? 0 : 1) - (b.type === "sales" ? 0 : 1) || upCost(a) - upCost(b))[0];
      if (f && S.cash - buffer > upCost(f)*1.5){ const c = upCost(f); S.cash -= c; discSpent += c; f.level++; rebuildWorkers(S.floors.indexOf(f)); if (S.idleMode){ S.cooCd = 8; toast(`The board upgraded ${TYPES[f.type].name} to level ${f.level}.`); } }
    }
  }
}

function offlineCheck(){
  if (!S.savedAt || S.over || !S.seen) return;
  const away = (Date.now() - S.savedAt)/1000;
  if (away < 120) return;
  const h = (S.profHist || []).filter(x => x > 0);
  const qProfit = h.length ? h.reduce((a, b) => a + b, 0)/h.length : 0;
  if (qProfit <= 0) return;
  const eff = Math.min(0.75, 0.15 + 0.1*execCount() + (lv("claims") ? 0.05 : 0));
  const quarters = Math.min(12, away/Q_LEN);
  const amt = Math.round(qProfit*quarters*eff);
  if (amt < 10) return;
  S.cash += amt; S.earned = (S.earned || 0) + amt; save();
  const hrs = Math.floor(away/3600), mins = Math.floor(away % 3600/60);
  openModal(`<h2>While you were away</h2>
    <p>You were gone for ${hrs ? hrs + "h " : ""}${mins}m. Your syndicate kept writing business and earned <b class="pos">${fmt(amt)}</b>.</p>
    <p class="dim">Away earnings are ${Math.round(eff*100)}% of your normal quarterly profit, for up to 12 quarters. ${execCount() < 6 ? "Every executive you hire adds 10%, up to 75%." : "Your full executive team is running things at 75%."}</p>
    <div class="closeRow"><button class="btn" data-act="close">Back to work</button></div>`);
}

const RUNS_KEY = "fineprint-runs", NAME_KEY = "fineprint-name";

function playerName(){ try { return localStorage.getItem(NAME_KEY) || ""; } catch(e){ return ""; } }
function esc(t){ return String(t).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch])); }
function recordRun(sp, reason){
  const runs = loadRuns(), run = {id:Date.now(), name:playerName() || "Fine Print Syndicate", score:sp.total, grade:grade(sp.total), quarters:S.quarter - 1, title:RANKS[S.rankIdx].name, end:reason, at:Date.now()};
  runs.push(run); runs.sort((a, b) => b.score - a.score); saveRuns(runs.slice(0, 20)); return run;
}
function lbTable(hl){

  // o: skin, hair, style, eyes, mouth, extras
  const t = o.t || 0, blink = fr(t*1.7) < 0.06;
  P(0, 0, 48, 48, o.bg || "#24264f"); for (let y = 0; y < 48; y += 3) P(0, y, 48, 1, "rgba(255,255,255,.03)");
  // shoulders
  P(6, 38, 36, 10, o.shirt); P(20, 38, 8, 10, o.collar || "#f4f1e8"); if (o.tie) P(22, 40, 4, 8, o.tie);
  P(19, 32, 10, 7, o.skin);
  // head
  oval(24, 22, 13, 15, o.skin); P(12, 26, 24, 2, "rgba(0,0,0,.08)");
  P(10, 20, 2, 6, o.skin); P(36, 20, 2, 6, o.skin);
  // hair
  if (o.hairStyle === "windswept"){ for (let k = 0; k < 9; k++) P(8 + k*3, 6 + (k%2)*2 - Math.sin(t*30 + k)*2, 8, 4, o.hair); P(10, 9, 30, 5, o.hair); P(34, 10, 10, 3, o.hair); }
  else if (o.hairStyle === "cap"){ P(10, 8, 28, 7, o.hair); P(8, 13, 32, 3, "#14142a"); P(20, 9, 8, 3, "#ffd23f"); }
  else if (o.hairStyle === "bob"){ P(10, 6, 28, 8, o.hair); P(9, 10, 4, 16, o.hair); P(35, 10, 4, 16, o.hair); }
  else if (o.hairStyle === "hood"){ oval(24, 20, 17, 19, o.hair); oval(24, 24, 12, 13, o.skin); }
  else { P(11, 7, 26, 7, o.hair); P(10, 10, 4, 8, o.hair); }
  // eyes
  const ey = 22, wide = o.eyes === "wide";
  if (blink){ P(15, ey + 1, 6, 1, "#1b1b2f"); P(27, ey + 1, 6, 1, "#1b1b2f"); }
  else { P(15, ey - (wide ? 1 : 0), 6, wide ? 5 : 4, "#ffffff"); P(27, ey - (wide ? 1 : 0), 6, wide ? 5 : 4, "#ffffff");
    const lx = o.look || 0; P(17 + lx, ey + (wide ? 0 : 1), wide ? 2 : 3, wide ? 2 : 3, "#1b1b2f"); P(29 + lx, ey + (wide ? 0 : 1), wide ? 2 : 3, wide ? 2 : 3, "#1b1b2f"); px(17 + lx, ey + 1, "#fff"); }
  if (o.brows === "worried"){ line(14, ey - 3, 20, ey - 5, "#1b1b2f"); line(28, ey - 5, 34, ey - 3, "#1b1b2f"); }
  else if (o.brows === "angry"){ line(14, ey - 5, 20, ey - 3, "#1b1b2f"); line(28, ey - 3, 34, ey - 5, "#1b1b2f"); }
  else { P(15, ey - 4, 6, 1, "#1b1b2f"); P(27, ey - 4, 6, 1, "#1b1b2f"); }
  if (o.glasses){ P(13, ey - 2, 10, 1, "#1b1b2f"); P(25, ey - 2, 10, 1, "#1b1b2f"); P(13, ey + 4, 10, 1, "#1b1b2f"); P(25, ey + 4, 10, 1, "#1b1b2f"); P(13, ey - 2, 1, 7, "#1b1b2f"); P(22, ey - 2, 1, 7, "#1b1b2f"); P(25, ey - 2, 1, 7, "#1b1b2f"); P(34, ey - 2, 1, 7, "#1b1b2f"); P(23, ey, 2, 1, "#1b1b2f"); }
  // mouth
  const talk = fr(t*7) < 0.5;
  if (o.mouth === "scream"){ oval(24, 32, 5, talk ? 4 : 3, "#5a1a1a"); P(21, 29, 6, 1, "#fff"); }
  else if (o.mouth === "grit"){ P(18, 31, 12, 3, "#fff"); for (let x = 19; x < 30; x += 2) P(x, 31, 1, 3, "#c8c8d0"); P(18, 31, 12, 1, "#1b1b2f"); P(18, 34, 12, 1, "#1b1b2f"); }
  else { P(20, 31, 8, talk ? 3 : 1, "#5a1a1a"); }
  P(22, 25, 3, 4, "rgba(0,0,0,.12)");
  if (o.beard){ P(14, 28, 20, 9, o.beard); P(18, 30, 12, 3, o.skin); P(20, 31, 8, talk ? 2 : 1, "#5a1a1a"); }
  if (o.sweat){ const sy = fr(t*1.2)*10; P(37, 14 + sy, 2, 3, "#9fd8ff"); px(37, 14 + sy, "#ffffff"); P(9, 18 + fr(t*1.2 + .5)*8, 2, 3, "#9fd8ff"); }
  if (o.headset){ P(8, 14, 3, 12, "#2a2a3a"); P(37, 14, 3, 12, "#2a2a3a"); P(10, 5, 28, 3, "#2a2a3a"); P(36, 26, 2, 6, "#2a2a3a"); P(30, 31, 7, 2, "#2a2a3a"); }
  // rim light
  for (let y = 10; y < 34; y++) px(24 + Math.floor(13*Math.sqrt(Math.max(0, 1 - ((y - 22)*(y - 22))/225))) - 1, y, "rgba(255,255,255,.25)");
  if (o.extra) o.extra(t);
}
const PORTRAITS = {

    const b = Math.sin(t*20)*1.5; oval(24, 36 + b, 15, 12, "#9aa3b5"); oval(24, 38 + b, 9, 8, "#c3cad8"); P(16, 28 + b, 16, 3, "#5bb38a");
    oval(24, 20 + b, 11, 11, "#9aa3b5"); P(13, 9 + b, 22, 5, "#ffd23f"); P(11, 13 + b, 26, 2, "#ffd23f"); P(15, 10 + b, 18, 1, "#fff6b0");
    tri(33, 19 + b, 44, 21 + b, 33, 24 + b, "#ff9f1c"); P(33, 21 + b, 9, 1, "#d97a10");
    const blink = fr(t*1.7) < .06; if (blink) P(25, 18 + b, 5, 1, "#111"); else { P(24, 15 + b, 7, 7, "#fff"); P(27, 16 + b, 3, 4, "#111"); px(27, 16 + b, "#fff"); }
    line(22, 12 + b, 30, 14 + b, "#1b1b2f");
    for (let k = 0; k < 4; k++) P(2 + k*2 + Math.sin(t*25 + k)*2, 30 - k*5, 6, 2, "rgba(220,230,200,.6)"); },
  cyber: t => face({t, skin:"#c68650", hair:"#1c1c1c", shirt:"#4bb7a8", collar:"#4bb7a8", eyes:"normal", brows:"worried", mouth:"grit", glasses:true, headset:true, sweat:true, bg:"#0b0e1c",
    extra: t => { if (fr(t*3) < .5){ P(13, 20, 10, 6, "rgba(255,40,80,.35)"); P(25, 20, 10, 6, "rgba(255,40,80,.35)"); } } }),
  bridge: t => face({t, skin:"#e0a878", hair:"#1f2a44", hairStyle:"cap", shirt:"#1f2a44", collar:"#f4f1e8", eyes:"normal", brows:"flat", mouth:"talk", beard:"#8a8a98", bg:"#3a2050", look:-1}),
  ash: t => face({t, skin:"#8d5524", hair:"#2b1b10", hairStyle:"bob", shirt:"#e8452c", collar:"#ffd23f", eyes:"wide", brows:"worried", mouth:"scream", bg:"#3a3346",
    extra: t => { for (let k = 0; k < 10; k++) px(fr(hs(k, 1) + t*0.1)*48, fr(hs(k, 2) + t*0.5)*48, "#9a9aa8"); } }),
  scandal: t => face({t, skin:"#ffdbac", hair:"#e86a92", hairStyle:"bob", shirt:"#2b2b3a", collar:"#f4f1e8", eyes:"wide", brows:"worried", mouth:"grit", sweat:true, bg:"#10142a",
    extra: t => { if (fr(t*5) < .15){ c.fillStyle = "rgba(255,255,255,.55)"; c.fillRect(0, 0, 48, 48); } } }),
  crash: t => face({t, skin:"#f2c39b", hair:"#9a9aa8", shirt:"#2b2d52", tie:"#ffd23f", eyes:"wide", brows:"angry", mouth:"scream", glasses:true, sweat:true, bg:"#2a0a14", look: Math.round(Math.sin(t*12)*1.5)}),
};
const LINES = {
  storm:{name:"Gary, Underwriting", line:"Quick! Check the policy wording for the word “wind”!"},
  tornado:{name:"Percy the Pigeon", line:"Coo. Coo! COO!! (Percy would like to report that the car park is now airborne.)"},

  drawPortrait(g, kind, t){ c = g; c.imageSmoothingEnabled = false; c.setTransform(1,0,0,1,0,0); c.clearRect(0, 0, 48, 48); (PORTRAITS[kind] || PORTRAITS.storm)(t); },
};

let cutsceneOn = false;
function playCutscene(kind, done){
  if (!scene){ done(); return; }
  cutsceneOn = true;
  const sc = scene, cam = sc.cameras.main, W = LW + 2*padX, H = viewH(), parts = [], timers = [];
  const add = o => { o.setScrollFactor(0).setDepth(200); parts.push(o); return o; };
  const txt = (x, y, str, size, color, extra) => add(sc.add.text(x, y, str, Object.assign({fontFamily:FONT, fontSize:pxL(size)+"px", fontStyle:"700", color, align:"center", resolution:Math.ceil(cz)}, extra || {})).setOrigin(0.5));
  const sw = SWANS[kind], L = CUT.LINES[kind] || {name:"", line:""};
  const mk = (key, w, h) => { if (!sc.textures.exists(key)){ const tx = sc.textures.createCanvas(key, w, h); tx.setFilter(Phaser.Textures.FilterMode.NEAREST); } return sc.textures.get(key); };
  const ftex = mk("cs_frame", CUT.SW, CUT.SH), ptex = mk("cs_face", 48, 48);
  const DUR = 5600, t0 = performance.now();
  const paintAll = () => { const tt = Math.min(1, (performance.now() - t0)/DUR); CUT.drawScene(ftex.getContext(), kind, tt); ftex.refresh(); CUT.drawPortrait(ptex.getContext(), kind, tt); ptex.refresh(); };
  paintAll();
  const k = Math.max(1, Math.min(W*0.96, (H*0.6)*CUT.SW/CUT.SH)/(pxL(360)));
  const bannerH = pxL(56)*Math.min(k, 1.6), gapY = pxL(8), dialogH = Math.max(pxL(100)*Math.min(k, 1.8), 30);
  let fw = W*0.96, fh = fw*CUT.SH/CUT.SW;
  const maxH = H - bannerH - dialogH - gapY*3 - pxL(26);
  if (fh > maxH){ fh = maxH; fw = fh*CUT.SW/CUT.SH; }
  const ts = Math.min(k, 1.8);
  const fx = (W - fw)/2, fy = bannerH + gapY;
  add(sc.add.rectangle(0, 0, W, H, 0x05050c, 0.95).setOrigin(0));
  add(sc.add.rectangle(0, 0, W, bannerH, 0xE8452C, 1).setOrigin(0));
  txt(W/2, bannerH*0.3, "Breaking news", 12*Math.min(k, 1.6), "#FFFFFF");
  txt(W/2, bannerH*0.68, sw.title, 15*Math.min(k, 1.6), "#FFD23F", {wordWrap:{width:W*0.94}});
  const frame = add(sc.add.image(fx, fy, "cs_frame").setOrigin(0).setDisplaySize(fw, fh));
  add(sc.add.rectangle(fx, fy, fw, fh).setOrigin(0).setStrokeStyle(pxL(3), 0xFFD23F));
  const dw = Math.min(fw, W*0.96), dx = (W - dw)/2, dy = fy + fh + gapY, ps = dialogH - pxL(14);
  add(sc.add.rectangle(dx, dy, dw, dialogH, 0x12133A, 1).setOrigin(0).setStrokeStyle(pxL(3), 0xFFD23F));
  add(sc.add.image(dx + pxL(7), dy + pxL(7), "cs_face").setOrigin(0).setDisplaySize(ps, ps));
  const tx0 = dx + ps + pxL(16), twid = dw - ps - pxL(26);
  add(sc.add.text(tx0, dy + pxL(8)*ts, L.name, {fontFamily:FONT, fontSize:pxL(14*ts)+"px", fontStyle:"700", color:"#FFD23F", resolution:Math.ceil(cz)}));
  const lineT = add(sc.add.text(tx0, dy + pxL(30)*ts, "", {fontFamily:FONT, fontSize:pxL(13*ts)+"px", color:"#FFFFFF", wordWrap:{width:twid}, lineSpacing:pxL(2)*ts, resolution:Math.ceil(cz)}));
  const skip = txt(W/2, Math.min(H - pxL(14), dy + dialogH + pxL(16)), "Tap to skip", 11, "#FFFFFF"); skip.setAlpha(.7);
  frame.setScale(frame.scaleX*0.92, frame.scaleY*0.92).setAlpha(0);
  sc.tweens.add({targets:frame, scaleX:fw/CUT.SW, scaleY:fh/CUT.SH, alpha:1, duration:260, ease:"Back.easeOut"});
  sfx("swan"); cam.shake(500, 0.006);
  let finished = false, lastBolt = 0;
  const end = () => { if (finished) return; finished = true; cutsceneOn = false; timers.forEach(t => t.remove(false)); parts.forEach(o => { sc.tweens.killTweensOf(o); o.destroy(); }); sc.input.off("pointerdown", onTap); done(); };
  timers.push(sc.time.addEvent({delay:70, loop:true, callback:() => {
    const el = performance.now() - t0; paintAll();
    const n = Math.min(L.line.length, Math.floor((el - 450)/30)); if (n > 0 && lineT.text.length !== n){ lineT.setText(L.line.slice(0, n)); if (n % 3 === 0) sfx("tick"); }
    if ((kind === "storm" || kind === "ash") && el - lastBolt > 700 && Math.random() < 0.08){ lastBolt = el; cam.shake(180, 0.004); }
    if (el > DUR + 700) end();
  }}));
  const onTap = () => { if (performance.now() - t0 > 600) end(); };
  sc.input.on("pointerdown", onTap);
}

function sue(a){ S.lawsuits.push({t:rand(12,25), amt:Math.round(a)}); }
function fireEvent(){
  if (!Array.isArray(S.recentEv)) S.recentEv = [];
  let pool = EVENTS.filter(e => (!e.cond || e.cond()) && !S.recentEv.includes(e.id));
  if (!pool.length) pool = EVENTS.filter(e => !e.cond || e.cond());
  const e = pick(pool); S.recentEv.push(e.id); if (S.recentEv.length > 22) S.recentEv.shift(); curEvent = e;
  const txt = typeof e.text === "function" ? e.text() : e.text;
  if (hasExec("cos")){
    const k = e.choices.length - 1, label = e.choices[k].label(), res = e.choices[k].run(); curEvent = null;
    toast(`${e.title}: your Chief of Staff chose “${label}.” ${res}`); checkRank(); save(); return;
  }
  openModal(`<h2>${e.title}</h2><p>${txt}</p>
    <div class="choices">${e.choices.map((c,k) => `<button class="btn ${k?"ghost":""}" data-act="ev:${k}">${c.label()}</button>`).join("")}</div>`, {locked:true});
}

/* ---------- Click handling ---------- */
$("#sheet").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const [a, p, q] = b.dataset.act.split(":");
  if (S.idleMode && ["build","up","mode","lim","demo","demo-yes","pay","deny","stall","cover","perk","price","dividend","loan","cashcall","exec","inv","prcamp","settle","buyback","bonus","ev","idle"].includes(a)){ toast("Idle mode is on. The board makes every decision now.", "bad"); return; }
  if (a === "idle"){
    openModal(`<h2>Hand over the keys?</h2><p>The board will make every decision from now on: claims, pricing, insurance, compliance, building, upgrades and events. You can keep watching.</p>
      <p class="dim">Be warned: the board is not you. It makes mistakes, blunders on vanity projects, is slow to buy insurance, and idle companies attract more black swans. It may not last forever.</p>
      <p class="note">This can’t be undone. You won’t be able to switch back to normal play, and this run won’t be recorded on the leaderboard or as a personal best.</p>
      <div class="seg"><button class="btn ghost" data-act="board">Keep control</button><button class="btn red" data-act="idle-yes">Turn on idle mode</button></div>`, {view:"idleconfirm"});
    return;
  }
  if (a === "idle-yes"){ S.idleMode = true; S.idleSpeed = 0.5; for (const x of EXECS) S.execs[x.id] = true; save(); closeModal(); toast("Idle mode is on. Sit back. The board has it from here.", "good"); return; }
  if (a === "close") closeModal();
  else if (a === "build") build(p);
  else if (a === "up") upgrade(+p, q);
  else if (a === "floor") openFloor(+p);
  else if (a === "mv"){
    const i = +p, j = i + (+q); if (j < 0 || j >= S.floors.length) return;
    [S.floors[i], S.floors[j]] = [S.floors[j], S.floors[i]]; [W[i], W[j]] = [W[j], W[i]]; [popT[i], popT[j]] = [popT[j], popT[i]];
    prevLevels = S.floors.map(f => f.level); prevCount = S.floors.length;
    sfx("tick"); save(); openFloor(j);
  }
  else if (a === "demo"){
    const i = +p, f = S.floors[i]; if (!f || S.floors.length <= 1) return;
    openModal(`<h2>Demolish ${TYPES[f.type].name}?</h2><p>This floor (level ${f.level}) and everyone in it will be gone for good. The builders will salvage about ${fmt(demoRefund(f))} of fixtures and fittings.</p>
      ${f.type === "compliance" ? `<p class="note">Removing Compliance may leave the regulator uncovered.</p>` : ""}
      <div class="seg"><button class="btn ghost" data-act="floor:${i}">Keep it</button><button class="btn red" data-act="demo-yes:${i}">Demolish</button></div>`, {view:"demo" + i});
  }
  else if (a === "demo-yes"){
    const i = +p, f = S.floors[i]; if (!f || S.floors.length <= 1) return;
    const refund = demoRefund(f); S.cash += refund;
    S.floors.splice(i, 1); W.splice(i, 1); popT.splice(i, 1);
    prevLevels = S.floors.map(x => x.level); prevCount = S.floors.length;
    if (scene) scene.cameras.main.shake(250, 0.004); sfx("stamp");
    toast(`${TYPES[f.type].name} demolished. You salvaged ${fmt(refund)}${f.type === "compliance" ? ". Check your Compliance cover." : "."}`, f.type === "compliance" ? "bad" : "good");
    save(); closeModal();
  }
  else if (a === "exec"){ const x = EXECS.find(x => x.id === p); if (!x || S.rankIdx < x.rank) return; S.execs[p] = q === "on"; toast(q === "on" ? `You hired a ${x.name}. ${x.joke}` : `Your ${x.name} has left to “spend more time with their yacht.”`, q === "on" ? "good" : ""); save(); openBoard(); }
  else if (a === "inv"){ S.invRisk = +p; save(); openFloor(+q); }
  else if (a === "prcamp"){
    const c = prCost(); if (S.prQ === S.quarter || S.cash < c) return;
    spend(c, "other"); S.prQ = S.quarter; mood(15); S.conf = clamp(S.conf + 6, 0, 100); sfx("chime");
    toast(pick(["PR released a heartfelt video of the CEO adopting a three-legged dog. Mood +15.","PR sponsored a puppy calendar. Customers are moved. Mood +15.","PR held a press conference with a choir. Nobody remembers what went wrong. Mood +15."]), "good");
    save(); const k = S.floors.findIndex(f => f.type === "pr"); if (k >= 0) openFloor(k); else closeModal();
  }
  else if (a === "lb") openLeaderboard();
  else if (a === "lbname"){
    const inp = $("#lbName"); const name = (inp ? inp.value : "").replace(/[<>]/g, "").trim().slice(0, 24) || "Fine Print Syndicate";
    try { localStorage.setItem(NAME_KEY, name); } catch(e){}

  const dy = o.anim.dy, a = o.anim.a, y = o.fy + dy;
